# ADR-0012/로드맵 STORAGE-01 검증용 override — MinIO 대신 실제 AWS S3를
# 백엔드로 붙여도 STORAGE_* 값만 바뀔 뿐 api 코드는 그대로 동작함을 보여준다.
# docker-compose.versity-demo.yml과 달리 S3는 관리형 서비스라 컨테이너로
# 띄울 대상이 없다 — app/gc/backup/restore의 STORAGE_* 환경변수만 재정의한다.
#
# 사용법 (base 파일과 함께 -f로 넘긴다):
#   docker compose -f docker-compose.yml -f docker-compose.s3-demo.yml up
#
# 사전 준비 (compose가 대신 해주지 않는다):
#   - AWS 콘솔/CLI로 버킷을 미리 만들어 둔다(자동 생성 없음 — 자격증명에
#     버킷 생성 권한까지 요구하지 않기 위해).
#   - IAM 사용자를 만들고 해당 버킷에 대한 최소 권한(GetObject/PutObject/
#     DeleteObject/ListBucket)만 부여한 access key를 발급한다.
#   - 아래 값을 .env에 추가한다(전부 샘플 — SAMPLE/XXX가 들어간 값은
#     실제 값이 아니다, 반드시 실제 발급받은 값으로 교체한다):
#       AWS_S3_REGION=SAMPLE-ap-northeast-2
#       AWS_S3_ACCESS_KEY_ID=AKIASAMPLEXXXXXXXXX
#       AWS_S3_SECRET_ACCESS_KEY=SAMPLEXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#       AWS_S3_BUCKET=SAMPLE-your-bucket-name
#     STORAGE_ENDPOINT를 s3.amazonaws.com으로 고정했다 — 리전에 따라
#     리다이렉트가 발생하면 s3.<region>.amazonaws.com으로 바꾼다.
#
# 왜 STORAGE_ACCESS_KEY 등 기존 이름을 재사용하지 않고 AWS_S3_* 라는 새
# 이름을 쓰는가: .env의 STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY는 base
# docker-compose.yml의 minio 컨테이너(MINIO_ROOT_USER/PASSWORD)에도 그대로
# 쓰인다. versity-demo는 로컬 컨테이너 자격증명이라 재사용해도 무해했지만,
# 여기서는 진짜 AWS 시크릿이라 미사용 minio 컨테이너로 흘러들어가지 않도록
# 별도 변수로 분리한다(minio 서비스 자체는 versity-demo와 마찬가지로 이
# override와 같이 켜져도 미사용 상태로 남는다 — 정리는 스코프 밖).
#
# 한계: MinioBlobStorage는 minio SDK Client를 그대로 쓰므로 정적
# access/secret key만 지원한다 — IAM 역할, STS 세션 토큰은 미지원.
#
# 값을 비워두면(.env에 채우지 않으면) 이 override를 켜는 순간 compose
# 파싱은 통과하지만, app이 실제로 스토리지에 접근하는 시점(부팅 헬스체크
# 또는 최초 요청)에 인증 실패로 드러난다 — RESTORE_SOURCE_DIR과 동일한
# 이유로 `${VAR:?}` 필수 마커는 쓰지 않는다(profile 필터링보다 먼저 파일
# 전체에 대해 평가돼, s3-demo와 무관한 profile 실행까지 막아버린다).

services:
  app:
    environment:
      STORAGE_ENDPOINT: s3.amazonaws.com
      STORAGE_PORT: 443
      STORAGE_USE_SSL: 'true'
      STORAGE_PATH_STYLE: 'false'
      STORAGE_REGION: ${AWS_S3_REGION:-}
      STORAGE_ACCESS_KEY: ${AWS_S3_ACCESS_KEY_ID:-}
      STORAGE_SECRET_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      STORAGE_BUCKET: ${AWS_S3_BUCKET:-}
      # presigned URL도 같은 엔드포인트를 그대로 쓴다 — S3는 애초에
      # 외부에서 접근 가능한 주소라 내부/외부 구분(STORAGE_PUBLIC_*)이
      # 필요 없다.
      STORAGE_PUBLIC_ENDPOINT: s3.amazonaws.com
      STORAGE_PUBLIC_PORT: '443'
      STORAGE_PUBLIC_USE_SSL: 'true'

  gc:
    environment:
      STORAGE_ENDPOINT: s3.amazonaws.com
      STORAGE_PORT: 443
      STORAGE_USE_SSL: 'true'
      STORAGE_PATH_STYLE: 'false'
      STORAGE_REGION: ${AWS_S3_REGION:-}
      STORAGE_ACCESS_KEY: ${AWS_S3_ACCESS_KEY_ID:-}
      STORAGE_SECRET_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      STORAGE_BUCKET: ${AWS_S3_BUCKET:-}

  backup:
    environment:
      STORAGE_ENDPOINT: s3.amazonaws.com
      STORAGE_PORT: 443
      STORAGE_USE_SSL: 'true'
      STORAGE_PATH_STYLE: 'false'
      STORAGE_REGION: ${AWS_S3_REGION:-}
      STORAGE_ACCESS_KEY: ${AWS_S3_ACCESS_KEY_ID:-}
      STORAGE_SECRET_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      STORAGE_BUCKET: ${AWS_S3_BUCKET:-}

  restore:
    environment:
      STORAGE_ENDPOINT: s3.amazonaws.com
      STORAGE_PORT: 443
      STORAGE_USE_SSL: 'true'
      STORAGE_PATH_STYLE: 'false'
      STORAGE_REGION: ${AWS_S3_REGION:-}
      STORAGE_ACCESS_KEY: ${AWS_S3_ACCESS_KEY_ID:-}
      STORAGE_SECRET_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      STORAGE_BUCKET: ${AWS_S3_BUCKET:-}
