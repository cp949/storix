        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/find:
    get:
      operationId: find
      summary: 하위 트리 재귀 검색(cursor 페이지네이션)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: false
          description: 검색 시작 디렉터리. 생략 시 namespace root.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: 이름 필터 값. 생략하면 이름으로 필터링하지 않는다.
          schema:
            type: string
        - name: match
          in: query
          required: false
          description: 이름 필터 매칭 방식. 생략하거나 알 수 없는 값이면 `exact`로 취급한다.
          schema:
            type: string
            enum: [exact, contains, prefix, suffix]
            default: exact
        - name: type
          in: query
          required: false
          description: 노드 타입 필터. 생략하거나 `FILE`/`DIRECTORY`가 아니면 필터링하지 않는다.
          schema:
            type: string
            enum: [FILE, DIRECTORY]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNodePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리가 아님(`VFS_NOT_DIRECTORY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/trash:
    get:
      operationId: listTrash
      tags: [Trash]
      summary: 미만료 휴지통 항목 목록
      description: 항목은 `deletedAt DESC, trashId ASC` 순서다. 30일 만료 항목은 조회에서 제외하며 잘못되거나 다른 namespace의 `tr1.` cursor는 400 `VFS_INVALID_CURSOR`다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: 휴지통 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/namespaces/{namespaceId}/fs/trash/{trashId}/restore:
    post:
      operationId: restoreTrash
      tags: [Trash]
      summary: 원래 node ID와 새 revision으로 휴지통 항목 복구
      description: 원래 경로 또는 선택한 `targetPath`에 subtree 전체를 복구한다. 부모는 자동 생성하지 않고 대상은 덮어쓰지 않는다. 동일 namespace/scope/key와 본문은 최초 status/body/X-Request-Id를 receipt로 재생한다. 원래 revision은 복구 뒤 유효하지 않다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/TrashId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/MutationScopeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                targetPath: { type: string, description: 생략하면 삭제 전 원래 경로 }
      responses:
        '200':
          description: 복구 완료 또는 동일 요청 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashRestoreResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 항목 또는 대상 부모 부재. 다른 namespace의 항목도 `VFS_TRASH_ITEM_NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: DB 시각 기준 만료(`VFS_TRASH_ITEM_EXPIRED`). GC purge 전에도 복구 불가.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: 대상 경로 충돌(`VFS_PRECONDITION_FAILED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
  /api/v2/namespaces/{namespaceId}/fs/trash/{trashId}/purge:
    post:
      operationId: purgeTrash
      tags: [Trash]
      summary: 관리자 전용 영구 삭제
      description: 보존 기한 전후에 단일 manifest를 영구 삭제한다. quota는 purge commit 뒤 해제하고 다른 live node·snapshot·휴지통 항목의 Blob 참조는 보존한다. 복구 불가. 동일 namespace/scope/key와 본문은 최초 응답을 재생한다.
      security:
        - AdminApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/TrashId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/MutationScopeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: 영구 삭제 완료 또는 동일 요청 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPurgeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 항목 또는 다른 namespace 항목(`VFS_TRASH_ITEM_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v2/namespaces/{namespaceId}/fs/snapshots:
    get:
      operationId: listFileSnapshots
      tags: [Snapshots]
      summary: 파일별 FILE snapshot 목록 조회
      description: 불변 rootNodeId로 FILE snapshot을 `createdAt DESC, snapshotId ASC` 순서로 조회한다. 원본 파일의 이동·삭제와 무관하며 TREE snapshot은 포함하지 않는다. cursor는 namespace와 rootNodeId에 결속되고 DB timestamp 정밀도를 보존한다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: rootNodeId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: 이전 페이지의 opaque `sl1.` cursor. 다른 namespace/node 또는 비정규 cursor는 400이다.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: FILE snapshot 페이지
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [snapshotId, createdAt, sourceRevision, logicalBytes, sha256]
                      properties:
                        snapshotId: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        sourceRevision: { type: string }
                        logicalBytes: { type: string, pattern: '^\d+$' }
                        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  nextCursor: { type: string, nullable: true }
        '400':
          description: 잘못된 rootNodeId (`VFS_INVALID_MUTATION_REQUEST`) 또는 cursor (`VFS_INVALID_CURSOR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSnapshot
      tags: [Snapshots]
      summary: 불변 FILE 또는 TREE snapshot 생성
      description: |
        현재 파일 또는 디렉터리 트리의 Blob, 정규화 MIME과 revision을 고정한다.
        TREE는 namespace root /도 허용하며 root 자체를 relative path .의 entry로 포함한다.
        nodeCount는 root를 포함한 모든 파일·디렉터리 수이고 logicalBytes는 파일 크기 합의
        십진 문자열이다. FILE의 nodeCount는 1이다. 원본 이동·수정·삭제 이후에도 유지하며
        자동 TTL 없이 명시적으로 삭제한다. 모든 manifest의 logicalBytes를 보존 예산에 합산한다.
        identity는 namespace/scope/key이다. method, canonical route/path, 정규화 command 및 exact raw JSON
        SHA-256을 fingerprint에 포함하므로 공백만 변경해도 MUTATION_KEY_REUSED다.

        **sourceRevision 조건.** FILE 요청은 선택 필드 `sourceRevision`(`r1.` revision)을 받을 수 있다.
        원본의 현재 revision이 다르면 snapshot을 만들지 않고 412를 반환한다. 비교는 캡처와 같은
        transaction에서 수행한다. PostgreSQL에서는 namespace root 행 잠금 아래라 비교와 캡처
        사이에 원본 변경이 끼어들지 않는다. 불일치 시 snapshot, manifest, Blob 참조, 보존 예산 사용량을 만들지 않는다.
        검사 순서는 원본 부재 404, 디렉터리 409, revision 불일치 412다. 문자열이 아닌
        `sourceRevision`(null, 숫자, 불리언, 객체, 배열)과 TREE 요청의 `sourceRevision`은
        400 `VFS_INVALID_MUTATION_REQUEST`, 문자열이지만 형식이 잘못되면 400 `VFS_INVALID_REVISION`이다.
        키를 생략하면 조건 없이 캡처한다. 같은 key에서
        `sourceRevision`만 바꾸거나 추가·제거하면 fingerprint가 달라 409 MUTATION_KEY_REUSED다.
        412 body의 `current`는 충돌 시점의 원본 metadata다.
        SQLite에서도 쿼리 게이트가 트랜잭션을 직렬화해 비교와 캡처의 원자성이 동시 요청에 대해
        성립한다(`docs/design/02-receipt-error-replay.md`).

        **오류 재생.** 요청 파싱·작업 단계의 결정적 4xx(400, 404, 409, 412,
        `VFS_SNAPSHOT_LIMIT_EXCEEDED` 413)는 receipt에 저장하고 저장이 끝난 뒤에만 응답한다.
        파싱은 claim 전에 실행하고 그 오류는 claim을 소유한 요청만 저장하므로, 같은 key의 완료
        receipt(재생 또는 409 MUTATION_KEY_REUSED)와 진행 중 claim(409 MUTATION_IN_PROGRESS)이
        파싱 오류보다 우선한다. 작업 단계 오류는 롤백 뒤 별도 transaction으로 저장한다. 같은 key와 같은 fingerprint의 재시도는 그 사이 상태가
        바뀌었더라도 최초 status, body, X-Request-Id를 완료 시점부터 30일간 재생한다.
        따라서 404·412·413 뒤 상태를 고치고 같은 key로 재시도하면 최초 오류가 재생되므로
        새 key를 사용해야 한다. 재생하지 않는 응답: 5xx(`DB_BUSY`, `STORAGE_UNAVAILABLE`, `STORAGE_FAILURE`, `INTERNAL_ERROR` 포함), 진행 중 key
        (409 MUTATION_IN_PROGRESS), 409 MUTATION_KEY_REUSED, 401. `Retry-After`는 저장하지 않는다.
        재생 불가 오류(receipt 없음): JSON 본문 16 KiB 초과 413, 잘못된 `Idempotency-Key`/
        `X-Mutation-Scope` 400, namespace 부재 404. 같은 상한과 상태에서는 같은 결과가 나오지만
        최초 응답 bytes와 X-Request-Id의 동일성은 보장하지 않는다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 비어 있지 않은 최대 128 UTF-8 bytes 문자열
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, path]
              properties:
                kind: { type: string, enum: [file, tree] }
                path:
                  type: string
                  description: FILE은 절대 파일 경로, TREE는 절대 디렉터리 경로(`/` 허용). 상단의 공통 경로 계약을 따른다.
                sourceRevision:
                  type: string
                  pattern: '^r1\.'
                  description: FILE 전용 선택 조건. 원본의 현재 revision과 다르면 412. TREE에 지정하면 400 `VFS_INVALID_MUTATION_REQUEST`.
      responses:
        '201':
          description: 생성 완료 또는 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotMetadata' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: VFS_IS_DIRECTORY·VFS_NOT_DIRECTORY(receipt로 재생), MUTATION_KEY_REUSED 또는 MUTATION_IN_PROGRESS(재생 대상 아님)
          headers:
            Retry-After:
              description: MUTATION_IN_PROGRESS 재시도까지 초
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: FILE `sourceRevision`이 원본의 현재 revision과 다름(`VFS_PRECONDITION_FAILED`). body의 `current`는 충돌 시점 원본 metadata이며 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: VFS_SNAPSHOT_LIMIT_EXCEEDED(receipt로 재생) 또는 JSON 본문 16 KiB 초과(재생 불가)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/snapshots/{snapshotId}:
    get:
      operationId: getSnapshot
      tags: [Snapshots]
      summary: 불변 snapshot metadata 조회
      description: 다른 namespace의 ID, 없는 ID 및 삭제된 ID는 모두 404다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: 캡처 시점 metadata. sourceRevision은 감사 정보이며 읽기 자격 증명이 아니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotMetadata' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/snapshots/{snapshotId}/entries:
    get:
      operationId: listSnapshotEntries
      tags: [Snapshots]
      summary: 불변 TREE manifest 페이지 조회
      description: |
        TREE 전용이다. FILE은 409 VFS_INVALID_OPERATION, snapshot 부재는 404 VFS_SNAPSHOT_NOT_FOUND다.
        root는 relativePath .이며 디렉터리와 파일을 함께 반환한다. UTF-8 relative path의
        lowercase hex path_key를 SQLite BINARY / PostgreSQL C collation으로 정렬한다.
        cursor는 sc1. + canonical base64url JSON {snapshotId,pathKey}이며 해당 snapshot에
        묶이고 만료되지 않는다. 다른 snapshot cursor 또는 비정규 cursor는 400 VFS_INVALID_CURSOR다.
        sourceRevision은 캡처 시점 정보다. 원본 변경은 페이지 내용과 순서에 영향을 주지 않는다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/SnapshotId'
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: 생략/빈 값/유효하지 않은 값은 100, 1000보다 큰 정수는 1000으로 제한한다.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: 고정된 manifest 페이지. 다음 페이지가 없으면 nextCursor는 null이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotEntryPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/snapshots/{snapshotId}/content:
    get:
      operationId: getSnapshotContent
      tags: [Snapshots]
      summary: FILE snapshot 또는 TREE manifest 파일의 고정된 bytes 조회
      description: |
        FILE에는 path query를 생략하고 TREE에는 relative path를 필수로 지정한다.
        HTTP query parser가 한 번 decode하며 추가 URL decode나 Unicode 정규화는 하지 않는다.
        상단의 공통 경로 계약에 따라 선행 /, .. 구간, backslash, 제어 문자,
        NFC가 아닌 이름과 UTF-8 한도 초과를 거부한다. 빈 구간과 dot 구간은 제거한 뒤
        manifest의 경로와 정확히 비교한다. 빈 값 또는 .은 root directory이므로 409
        VFS_IS_DIRECTORY이다. 디렉터리는 409, 없는 entry는 404 VFS_NODE_NOT_FOUND다.
        %2F는 한 번 decode한 /이며 %252F는 literal %2F다. 배열·object path는 400이다.
        manifest의 정규화 MIME을 반환하며 암호화 namespace도 복호화한 원본 bytes와 Range를 제공한다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/SnapshotId'
        - name: path
          in: query
          required: false
          description: TREE에는 필수 relative file path, FILE에는 생략한다. HTTP에서 한 번 decode한 문자열이다.
          schema: { type: string }
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 고정된 전체 콘텐츠. 실제 Content-Type은 manifest에 저장된 정규화 MIME이다.
          headers:
            Content-Length: { schema: { type: integer } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 고정된 부분 콘텐츠. 실제 Content-Type은 manifest의 정규화 MIME이다.
          headers:
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            X-Storix-File-Id:
              description: 반환한 바이트의 원본 파일 노드 UUID. FILE은 rootNodeId, TREE는 entry의 sourceNodeId다.
              schema: { type: string, format: uuid }
            X-Storix-Revision:
              description: 반환한 바이트의 원본 파일 revision. FILE은 sourceRevision, TREE는 entry의 sourceRevision이다.
              schema: { type: string, pattern: '^r1\.[A-Za-z0-9_-]{32}$' }
            X-Storix-Snapshot-Id:
              description: 반환한 바이트가 속한 snapshot UUID.
              schema: { type: string, format: uuid }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '416':
          description: VFS_RANGE_NOT_SATISFIABLE
          headers:
            Content-Range:
              description: '거부된 Range의 전체 표현 길이: `bytes */<전체 길이>`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/snapshots/{snapshotId}/restore:
    post:
      operationId: restoreSnapshot
      tags: [Snapshots]
      summary: FILE snapshot을 현재 파일로 조건부 복원
      description: |
        ifAbsent: true 또는 현재 target의 ifRevision: r1... 중 정확히 하나를 요구한다.
        부모 디렉터리는 이미 있어야 하며 target /는 허용하지 않는다.
        고정된 Blob의 binary bytes와 정규화 MIME을 그대로 연결하고 snapshot은 유지한다.
        namespace root 다음 snapshot row를 잠그므로 delete가 먼저 완료되면 404 VFS_SNAPSHOT_NOT_FOUND,
        restore가 먼저 완료되면 이후 snapshot 삭제에도 현재 파일은 읽을 수 있다.
        Node/Blob 참조/revision/receipt는 한 transaction으로 커밋한다.
        같은 Blob으로 교체하면 참조 변화량은 0이며 현재 파일과 조상 revision은 갱신한다.
        namespace/scope/key, method, canonical route/command, exact raw JSON SHA-256을 식별한다.
        완료 결과의 status/body/X-Request-Id를 완료 시점부터 30일 재생한다. 다른 bytes/route/조건의
        key 재사용은 409 MUTATION_KEY_REUSED다.

        **오류 재생.** 요청 파싱·작업 단계의 결정적 4xx(400, 404, 409, 412, 428)는 receipt에
        저장하고 저장이 끝난 뒤에만 응답한다. 파싱은 claim 전에 실행하고 그 오류는 claim을 소유한
        요청만 저장하므로, 같은 key의 완료 receipt(재생 또는 409 MUTATION_KEY_REUSED)와 진행 중
        claim(409 MUTATION_IN_PROGRESS)이 파싱 오류보다 우선한다. 작업 단계 오류는 롤백 뒤 별도
        transaction으로 저장한다. 같은 key와 같은
        fingerprint의 재시도는 그 사이 상태가 바뀌었더라도 최초 status, body, X-Request-Id를
        재생한다. 따라서 404·412 뒤 상태를 고치고 같은 key로 재시도하면 최초 오류가 재생되므로
        새 key를 사용해야 한다. 재생하지 않는 응답: 5xx(`DB_BUSY`, `STORAGE_UNAVAILABLE`, `STORAGE_FAILURE`, `INTERNAL_ERROR` 포함), 진행 중 key
        (409 MUTATION_IN_PROGRESS), 409 MUTATION_KEY_REUSED, 401. `Retry-After`는 저장하지 않는다.
        UUID 형식이 아닌 `snapshotId`는 raw route와 raw JSON body를 fingerprint해 404 `VFS_SNAPSHOT_NOT_FOUND` receipt로 저장한다.
        이 경로 오류는 identity가 유효하지 않거나 namespace가 없으면 기존처럼 반환하되 저장하지 않는다. receipt가 namespace
        foreign key를 참조하기 때문이다. 이 404도 완료 receipt 재생, 409 MUTATION_KEY_REUSED, 409 MUTATION_IN_PROGRESS보다
        먼저 판정하지 않는다.
        재생 불가 오류(receipt 없음): JSON 본문 16 KiB 초과 413, 잘못된 `Idempotency-Key`/
        `X-Mutation-Scope` 400, namespace 부재 404. 본문 상한 초과는 서비스 전에 거절되며, identity 검증 오류는 receipt key를
        만들 수 없으므로 재생하지 않는다.
        같은 상한과 상태에서는 같은 결과가 나오지만 최초 응답 bytes와 X-Request-Id의 동일성은
        보장하지 않는다.
        412 body의 `current`는 충돌 시점의 target metadata이며 재생 시에도 최초 값이다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/SnapshotId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 비어 있지 않은 최대 128 UTF-8 bytes 문자열
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnapshotRestoreRequest' }
      responses:
        '200':
          description: 기존 target 파일 교체 또는 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotRestoreResult' }
        '201':
          description: target 파일 생성 또는 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotRestoreResult' }
        '400':
          description: 두 조건 동시 지정, 잘못된 조건/revision/path 또는 JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: FILE snapshot/namespace/target parent가 없거나 ifRevision target이 없음. UUID 형식 오류 snapshotId는 유효 identity·namespace에서 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: target이 directory 등 도메인 409(receipt로 재생), MUTATION_KEY_REUSED 또는 MUTATION_IN_PROGRESS(재생 대상 아님)
          headers:
            Retry-After:
              description: MUTATION_IN_PROGRESS 재시도까지 초
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: ifAbsent target 존재 또는 ifRevision 불일치. body의 `current`는 충돌 시점 target metadata이며 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: JSON 본문 16 KiB 초과(재생 불가)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: ifAbsent와 ifRevision이 모두 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/namespaces/{namespaceId}/fs/snapshots/{snapshotId}/delete:
    post:
      operationId: deleteSnapshot
      tags: [Snapshots]
      summary: snapshot 명시적 삭제
      description: |
        FILE/TREE metadata와 manifest, Blob 참조, 보존 예산을 원자적으로 해제한다.
        namespace/scope/key와 method, canonical route, command, exact raw JSON SHA-256으로
        생성과 같은 receipt 계약을 적용한다. 동일 key 재시도는 snapshot이 삭제된 뒤에도
        완료 시점부터 30일 동안 최초 200/body/X-Request-Id를 재생한다. 다른 bytes/route는
        409 MUTATION_KEY_REUSED다. receipt 보존 기간 이후 또는 새 key로 삭제된 snapshot에
        요청하면 404 VFS_SNAPSHOT_NOT_FOUND다. UUID 형식이지만 없는 snapshot의 404와 UUID 형식이 아닌 `snapshotId` 404는 결정적 4xx라
        receipt로 저장되어, 같은 identity와 body 재시도에서 최초 status/body/`X-Request-Id`를 재생한다. 잘못된 UUID 형식은
        raw route 및 raw JSON body를 fingerprint한다. 유효한 identity와 namespace root가 필요하며, identity 검증 실패 또는
        namespace 부재 응답은 저장하지 않는다. 재생하지 않는 응답과 재생 불가 오류는 snapshot restore와 같다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/SnapshotId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 비어 있지 않은 최대 128 UTF-8 bytes 문자열
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
              example: {}
      responses:
        '200':
          description: 삭제 완료 또는 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [snapshotId, deleted]
                properties:
                  snapshotId: { type: string, format: uuid }
                  deleted: { type: boolean, enum: [true] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: MUTATION_KEY_REUSED 또는 MUTATION_IN_PROGRESS
          headers:
            Retry-After:
              description: MUTATION_IN_PROGRESS 재시도까지 초
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: JSON 본문 16 KiB 초과(재생 불가)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        정적 API 키 슬라이스 인증(`apps/api/docs/adr/0007-service-auth-static-api-key.md`).
        배포 전체가 공유하는 단일 키 쌍(`STORIX_API_KEY`, 로테이션 중엔
        `STORIX_API_KEY_PREVIOUS`) 중 하나와 일치해야 한다. 실패 사유는
        구분해 알려주지 않고 항상 401만 반환한다.
    AdminApiKeyAuth:
      type: http
      scheme: bearer
      description: 별도 `STORIX_ADMIN_API_KEY` 또는 로테이션 중 이전 관리자 key. 일반 서비스 key는 허용하지 않는다.
  parameters:
    TrashId:
      name: trashId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MutationScopeHeader:
      name: X-Mutation-Scope
      in: header
      required: true
      description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
      schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
    UploadSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    RangeHeader:
      name: Range
      in: header
      required: false
      description: |
        단일 byte 범위만 허용한다. 시작-끝 `bytes=0-1023`, 열린 끝 `bytes=500-`,
        suffix `bytes=-500` 형식을 지원한다. 끝값이 전체 길이를 넘으면 마지막 byte로
        clipping하며, 길이보다 긴 suffix는 전체 콘텐츠를 206으로 반환한다.
        잘못된 문법, 복수 범위, 충족 불가 범위는 416 `VFS_RANGE_NOT_SATISFIABLE`로 거부하고
        `Content-Range: bytes */<전체 길이>`를 반환한다. 206에는 전체 파일의
        `X-Storix-Sha256`을 제공하지 않는다. `If-Range`는 미지원이다.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 페이지 응답의 `nextCursor`. 불투명 문자열이며 형식을 가정하면 안 된다.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 페이지당 최대 항목 수. 유효하지 않은 값은 기본값으로 대체된다.
      schema:
        type: integer
        default: 100
        maximum: 1000
  headers: {}
  responses:
    BadRequest:
      description: '요청이 유효하지 않음(예: `VFS_INVALID_PATH`, `NAMESPACE_INVALID_NAME`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: '`Authorization` 헤더가 없거나 유효하지 않음(`UNAUTHORIZED`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Namespace 또는 경로를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 대상 상태와 충돌하는 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UploadSessionCreateRequest:
      description: ifAbsent 또는 ifRevision 중 정확히 하나를 지정한다. 선택적 sha256은 저장 전 전체 평문 바이트의 SHA-256 소문자 hex다. 만료 입력은 ifAbsent에서만 허용한다. 추가 필드는 허용하지 않는다.
      oneOf:
        - type: object
          additionalProperties: false
          required: [path, sizeBytes, mimeType, ifAbsent]
          properties:
            path: { type: string, description: 정규화되는 절대 파일 경로. 부모 디렉터리가 있어야 한다. }
            sizeBytes: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
            mimeType:
              type: string
              maxLength: 255
              pattern: '^[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*/[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*$'
              description: MIME type; 응답/저장 시 소문자로 정규화된다.
            ifAbsent: { type: boolean, enum: [true] }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            expiresInSeconds:
              type: integer
              minimum: 1
              description: 새 FILE 만료 초. 기본 60~2592000초, 설정 최대 2147483647초. 생성 시 검사하고 완료 커밋의 DB 시각을 기준으로 적용한다.
        - type: object
          additionalProperties: false
          required: [path, sizeBytes, mimeType, ifRevision]
          properties:
            path: { type: string, description: 정규화되는 절대 파일 경로. 부모 디렉터리가 있어야 한다. }
            sizeBytes: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
            mimeType:
              type: string
              maxLength: 255
              pattern: '^[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*/[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*$'
            ifRevision: { type: string, pattern: '^r1\.' }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    UploadSessionCreated:
      type: object
      additionalProperties: false
      required: [sessionId, state, partSizeBytes, partCount, expiresAt, maxExpiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        state: { type: string, enum: [OPEN] }
        partSizeBytes: { type: integer, minimum: 1 }
        partCount: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        maxExpiresAt: { type: string, format: date-time }
    UploadSessionStatus:
      type: object
      additionalProperties: false
      required:
        [
          sessionId,
          state,
          partSizeBytes,
          partCount,
          expiresAt,
          maxExpiresAt,
          path,
          sizeBytes,
          mimeType,
          condition,
          parts,
        ]
      properties:
        sessionId: { type: string, format: uuid }
        state: { type: string, enum: [OPEN, FINALIZING, COMPLETED, CANCELLED, EXPIRED, FAILED] }
        partSizeBytes: { type: integer, minimum: 1 }
        partCount: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        maxExpiresAt: { type: string, format: date-time }
        path: { type: string }
        sizeBytes: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        mimeType: { type: string }
        condition:
          oneOf:
            - type: object
              additionalProperties: false
              required: [ifAbsent]
              properties:
                ifAbsent: { type: boolean, enum: [true] }
                expiresInSeconds: { type: integer, minimum: 1 }
            - type: object
              additionalProperties: false
              required: [ifRevision]
              properties:
                ifRevision: { type: string, pattern: '^r1\.' }
        parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, sizeBytes]
            properties:
              index: { type: integer, minimum: 0 }
              sizeBytes: { type: string, pattern: '^[0-9]+$' }
        result:
          description: COMPLETED 상태에서만 존재하는 최초 완료 응답 본문
          $ref: '#/components/schemas/UploadSessionCompleteResult'
        failure:
          description: FAILED 상태에서만 존재하는 실패 코드. 기대값과 계산값은 공개하지 않는다.
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string, enum: [VFS_CHECKSUM_MISMATCH] }
    UploadPartResult:
      type: object
      additionalProperties: false
      required: [index, sizeBytes, sha256, replayed]
      properties:
        index: { type: integer, minimum: 0 }
        sizeBytes: { type: string, pattern: '^[0-9]+$' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: 평문 조각 SHA-256 }
        replayed: { type: boolean }
    UploadSessionCompleteResult:
      $ref: '#/components/schemas/ConditionalContentResult'
    SnapshotRestoreRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, description: 기존 부모 아래 절대 파일 경로 }
        ifAbsent: { type: boolean, enum: [true] }
        ifRevision: { type: string, description: 현재 target의 r1. revision }
      oneOf:
        - required: [ifAbsent]
          not: { required: [ifRevision] }
        - required: [ifRevision]
          not: { required: [ifAbsent] }
    SnapshotRestoreResult:
      allOf:
        - $ref: '#/components/schemas/ConditionalMutationResult'
        - type: object
          required: [snapshotId]
          properties:
            snapshotId: { type: string, format: uuid }
    ChangeFeedPage:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/ChangeFeedEvent' }
        nextCursor: { type: string, description: 불투명 재개 cursor }
        hasMore: { type: boolean, description: 조회 시점의 다음 이벤트 존재 여부 }
    ChangeFeedEvent:
      type: object
      required:
        [sequence, operationId, operationIndex, operationCount, kind, nodeId, nodeType, path, occurredAt]
      properties:
        sequence: { type: string, pattern: '^[0-9]+$', description: namespace 내 십진 순서 번호 }
        operationId: { type: string, format: uuid }
        operationIndex: { type: integer, minimum: 0 }
        operationCount: { type: integer, minimum: 1 }
        kind: { type: string, enum: [created, updated, moved, deleted] }
        nodeId: { type: string, format: uuid }
        nodeType: { type: string, enum: [FILE, DIRECTORY] }
        path: { type: string, description: 삭제 이벤트에서는 삭제 직전 경로 }
        previousPath: { type: string, description: moved 이벤트에서만 존재 }
        revision: { type: string, description: 살아 있는 노드 이벤트에서만 존재 }
        occurredAt: { type: string, format: date-time }
    SnapshotEntryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SnapshotEntry' }
        nextCursor: { type: string, nullable: true, description: sc1. snapshot-bound cursor }
    SnapshotEntry:
      type: object
      required: [relativePath, type, sourceNodeId, sourceRevision, size, mimeType, contentPath]
      properties:
        relativePath: { type: string, description: root는 .이며 나머지는 상대 경로다. }
        type: { type: string, enum: [FILE, DIRECTORY] }
        sourceNodeId: { type: string, format: uuid }
        sourceRevision: { type: string, description: 캡처 시점 r1. revision }
        size:
          {
            type: string,
            nullable: true,
            pattern: '^[0-9]+$',
            description: 파일 bytes 십진 문자열. 디렉터리는 null.,
          }
        mimeType: { type: string, nullable: true }
        contentPath:
          { type: string, nullable: true, description: FILE content GET 상대 URL. 디렉터리는 null. }
    SnapshotMetadata:
      type: object
      required:
        [
          snapshotId,
          kind,
          sourcePath,
          sourceRevision,
          rootNodeId,
          sha256,
          rootType,
          nodeCount,
          logicalBytes,
          createdAt,
        ]
      properties:
        snapshotId: { type: string, format: uuid }
        kind: { type: string, enum: [file, tree] }
        sourcePath: { type: string }
        sourceRevision: { type: string, description: 캡처 시점 r1. revision }
        rootNodeId:
          {
            type: string,
            format: uuid,
            description: FILE에서는 캡처된 원본 파일의 안정적인 노드 ID. TREE에서는 원본 디렉터리 노드 ID.,
          }
        sha256:
          {
            type: string,
            nullable: true,
            pattern: '^[0-9a-f]{64}$',
            description: FILE 보존 원본 바이트의 SHA-256. TREE에서는 null.,
          }
        rootType: { type: string, enum: [FILE, DIRECTORY] }
        nodeCount: { type: integer, minimum: 1 }
        logicalBytes: { type: string, pattern: '^[0-9]+$' }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      description: |
        모든 4xx/5xx 응답의 공통 형태. RQ-018 범주의 공개 code, HTTP 상태, receipt·같은 key
        재시도 정책은 이 문서 상단의 “RQ-018 오류·재시도 계약” 표를 따른다. 그 밖의 endpoint 전용
        오류는 해당 operation 설명을 따른다. 500의 `message`는 고정된 안전 문구이며 내부 예외
        메시지나 비밀을 노출하지 않는다. `path`는 500 응답이나 요청 경로와 무관한 오류에서는
        생략될 수 있다.
      required: [code, message, requestId]
      properties:
        code:
          type: string
          example: VFS_NODE_NOT_FOUND
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
          description: '`X-Request-Id` 요청 헤더 값 또는 서버가 생성한 값. 응답 `X-Request-Id` 헤더에도 echo된다.'
    PreconditionFailedResponse:
      description: |
        412 `VFS_PRECONDITION_FAILED` 응답. `current`는 충돌 시점에 트랜잭션 안에서 읽은
        대상 노드의 공통 metadata(`VfsNode` 필드)와 그 시점의 `revision`이며 노드가 없으면
        null이다. 소비자는 `current.revision`으로 충돌 시점 ETag를 만들 수 있다.
        receipt로 저장되는 endpoint에서는 재생 응답도 최초 `current`(`revision` 포함)를
        반환하고 이후 파일 변경을 반영하지 않는다. 다른 오류 코드의 body에는 `current`가 없다.
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [current]
          properties:
            current:
              $ref: '#/components/schemas/PreconditionFailedCurrent'
    PreconditionFailedCurrent:
      type: object
      nullable: true
      description: |
        412 `current`의 노드 shape. `VfsNode`의 모든 필드에 충돌 시점의 `revision`을 더한다.
        `GET /fs/stat`은 별도 `VfsStat`으로 SHA-256까지 반환한다. 노드가 없으면 `null`이다.
        OpenAPI 3.0.3에서 `nullable`은 같은 스키마 객체에 `type`이 있을 때만 유효하므로
        `VfsNode`를 `allOf`로 재사용하지 않고 필드를 직접 나열한다.
      required: [id, path, name, type, size, mimeType, createdAt, updatedAt, version, expiresAt, revision]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [FILE, DIRECTORY]
        size:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: string
          pattern: '^r1\.'
          description: 충돌 시점 노드의 revision. 이후 노드가 바뀌어도 이 값은 고정된다.
    Namespace:
      type: object
      required: [id, name, encryptionPolicy, accessPolicy, status, limits, quota, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 불변 식별자.
        name:
          type: string
          pattern: '^[a-z0-9_-]{1,128}$'
          description: 사람이 정하는 재사용 가능한 slug. 식별자가 아님.
        encryptionPolicy:
          type: string
          enum: [NONE, ENCRYPTED]
          description: 생성 시 고정되며 이후 변경할 수 없다(`apps/api/docs/adr/0001-namespace-encryption-immutable.md`).
        accessPolicy:
          type: string
          enum: [PRIVATE, PUBLIC]
          description: 생성 시 고정되며 이후 변경할 수 없다(`apps/api/docs/adr/0023-public-namespace-unauthenticated-download.md`).
        status:
          type: string
          enum: [ACTIVE, DELETING, DELETED]
        limits:
          type: object
          required: [maxFileSizeBytes]
          properties:
            maxFileSizeBytes:
              type: string
              pattern: '^[0-9]+$'
              description: namespace 재정의와 전역 파일 크기 상한 중 적용되는 작은 값(바이트). 전역 기본값은 5368709120이다.
        quota:
          type: object
          required: [limitBytes, usedBytes, trash]
          properties:
            limitBytes:
              type: string
              pattern: '^[0-9]+$'
              description: 적용된 전역 또는 namespace 상한(바이트).
            usedBytes:
              type: string
              pattern: '^[0-9]+$'
              description: live FILE, 보존 snapshot FILE entry, purge 전 휴지통 FILE entry의 논리 크기 합.
            trash:
              type: object
              required: [enabled, retainedNodeCount, maxRetainedNodes]
              properties:
                enabled:
                  { type: boolean, description: 기본값은 false이며 namespace 관리자 정책으로 변경한다. }
                retainedNodeCount: { type: integer, minimum: 0 }
                maxRetainedNodes: { type: integer, minimum: 1, default: 100000 }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateNamespaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9_-]{1,128}$'
        encryptionPolicy:
          type: string
          enum: [NONE, ENCRYPTED]
          default: NONE
        accessPolicy:
          type: string
          enum: [PRIVATE, PUBLIC]
          default: PRIVATE
          description: '생성 후 변경할 수 없다. `ENCRYPTED`와 함께 지정하면 `NAMESPACE_PUBLIC_ENCRYPTION_CONFLICT`로 거부된다.'
        maxTotalLogicalBytes:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Namespace 논리 사용량 상한(바이트). 생략 시 전역 기본 상한.
    VfsNode:
      type: object
      description: Namespace 안의 파일 또는 디렉터리 하나(`apps/api/CONTEXT.md`의 VFS Node).
      required: [id, path, name, type, size, mimeType, createdAt, updatedAt, version, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: 안정적인 VFS 노드 ID. 이동·이름 변경·내용 교체 후 유지되고 삭제 뒤 재생성되면 달라진다.
        path:
          type: string
          description: 사용자가 보는 경로 문자열. 식별자가 아니다(이동/이름변경으로 바뀔 수 있음).
        name:
          type: string
        type:
          type: string
          enum: [FILE, DIRECTORY]
        size:
          type: integer
          nullable: true
          description: DIRECTORY는 항상 `null`.
        mimeType:
          type: string
          nullable: true
          description: DIRECTORY는 항상 `null`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: 낙관적 동시성 제어용. `PUT content`의 `If-Match`에 사용한다.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            만료 예정 FILE의 만료 시각. null이면 만료 없음. 이 시각 이후 첫 GC 실행에서
            삭제될 수 있으며, 삭제 전까지는 조회·확정할 수 있다. `persist`로 해제한다.
            DIRECTORY는 항상 null. 기존 receipt 재생 응답에는 이 필드가 없을 수 있다.
    VfsStat:
      description: 같은 읽기 시점의 노드와 참조 Blob 메타데이터.
      allOf:
        - $ref: '#/components/schemas/VfsNode'
        - type: object
          required: [revision, sha256]
          properties:
            revision:
              type: string
              pattern: '^r1\.'
              description: 이 응답의 노드 상태를 식별하는 불투명 revision 토큰.
            sha256:
              type: string
              nullable: true
              pattern: '^[0-9a-f]{64}$'
              description: FILE은 복호화한 원본 전체 바이트의 SHA-256, DIRECTORY는 null. 빈 파일도 64자리 해시를 반환한다.
    ConditionalMutationResult:
      type: object
      required: [resource, affectedRevisions]
      properties:
        trashId:
          type: string
          format: uuid
          description: 'kind: delete 성공에만 존재. 동일 receipt 재생에서 같은 ID를 반환한다.'
        resource:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VfsNode'
        affectedRevisions:
          type: array
          items:
            type: object
            required: [path, revision]
            properties:
              path: { type: string }
              revision: { type: string, pattern: '^r1\.' }
    TrashItem:
      type: object
      required: [trashId, originalPath, rootType, deletedAt, expiresAt, nodeCount, logicalBytes]
      properties:
        trashId: { type: string, format: uuid }
        originalPath: { type: string }
        rootType: { type: string, enum: [FILE, DIRECTORY] }
        deletedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 삭제 시각으로부터 30일 }
        nodeCount: { type: integer, minimum: 1 }
        logicalBytes: { type: string, pattern: '^[0-9]+$' }
    TrashPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrashItem' }
        nextCursor: { type: string, nullable: true }
    TrashRestoreResult:
      type: object
      required: [trashId, resource]
      properties:
        trashId: { type: string, format: uuid }
        resource:
          allOf:
            - $ref: '#/components/schemas/VfsNode'
            - type: object
              required: [revision]
              properties:
                revision: { type: string, pattern: '^r1\.' }
    TrashPurgeResult:
      type: object
      required: [trashId, purged]
      properties:
        trashId: { type: string, format: uuid }
        purged: { type: boolean, enum: [true] }
    ConditionalContentResult:
      type: object
      required: [resource, affectedRevisions]
      properties:
        resource:
          allOf:
            - $ref: '#/components/schemas/VfsNode'
            - type: object
              required: [revision]
              properties:
                revision:
                  type: string
                  pattern: '^r1\.'
                  description: 성공한 생성 또는 교체 상태의 revision. receipt 재생에서도 동일하다.
        affectedRevisions:
          type: array
          items:
            type: object
            required: [path, revision]
            properties:
              path: { type: string }
              revision: { type: string, pattern: '^r1\.' }
    VfsNodePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VfsNode'
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 요청의 `cursor`. 더 가져올 항목이 없으면 `null`.
    RevisionVfsNodePage:
      type: object
      required: [items, nextCursor, directoryRevision]
      properties:
        directoryRevision: { type: string, pattern: '^r1\.' }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VfsNode'
              - type: object
                required: [revision]
                properties:
                  revision: { type: string, pattern: '^r1\.' }
        nextCursor:
          type: string
          nullable: true
          description: '`rc1.` 접두사를 가진 다음 페이지 cursor. 없으면 null.'
    MkdirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        parents:
          type: boolean
          default: false
          description: 상위 디렉터리가 없으면 함께 생성할지 여부.
    TouchRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        parents:
          type: boolean
          default: false
          description: 상위 디렉터리가 없으면 함께 생성할지 여부.
    MoveRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          type: string
        destination:
          type: string
        destinationParents:
          type: boolean
          default: false
          description: 목적지 상위 디렉터리가 없으면 함께 생성할지 여부.
    CopyRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          type: string
        destination:
          type: string
        destinationParents:
          type: boolean
          default: false
          description: 목적지 상위 디렉터리가 없으면 함께 생성할지 여부.
    PresignedDownload:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
