  /api/v2/namespaces/{namespaceId}/fs/mutations:
    post:
      operationId: conditionalMutation
      summary: 조건부 VFS 변경
      tags: [fs]
      description: |
        mkdir/delete/move/copy/persist를 원자적으로 적용한다. 같은 scope와 UUID key의
        같은 raw JSON bytes는 최초 status, body, X-Request-Id를 완료 시점부터 30일간 재생한다.
        receipt identity는 namespace/scope/key이며 fingerprint에는 method, route,
        정규화 command와 exact raw JSON SHA-256이 포함된다. 다른 요청으로 key를
        재사용하면 409 MUTATION_KEY_REUSED다. 성공 시 Node/Blob 참조/revision 변경과
        receipt는 한 transaction으로 커밋한다.

        **오류 재생.** 요청 파싱·작업 단계의 결정적 4xx(400 `VFS_INVALID_PATH`와
        요청 형식 오류, 404, 409, 412, 428, 상한 초과 413)는 receipt에 저장하고, 저장이 끝난
        뒤에만 응답한다. 파싱은 claim 전에 실행하고 그 오류는 claim을 소유한 요청만 저장하므로,
        같은 key의 완료 receipt(재생 또는 409 MUTATION_KEY_REUSED)와 진행 중 claim
        (409 MUTATION_IN_PROGRESS)이 파싱 오류보다 우선한다. 작업 단계 오류는 변경을 롤백한 뒤
        별도 transaction으로 저장한다. 같은 key와 같은
        fingerprint의 재시도는 그 사이 상태가 바뀌었더라도 최초 status, body,
        X-Request-Id를 완료 시점부터 30일간 재생한다. 따라서 404·412·413 뒤 상태를 고치고
        같은 key로 재시도하면 최초 오류가 재생되므로 새 key를 사용해야 한다. 경로를 고친
        요청은 fingerprint가 달라 같은 key에서 409 MUTATION_KEY_REUSED다.
        재생하지 않는 응답: 5xx(`DB_BUSY`, `STORAGE_UNAVAILABLE`, `STORAGE_FAILURE`, `INTERNAL_ERROR` 포함), 진행 중 key(409 MUTATION_IN_PROGRESS),
        409 MUTATION_KEY_REUSED, 401. 이 응답들은 receipt를 남기지 않고 재시도가 다시 평가한다.
        `Retry-After`는 저장하지 않는다.

        **재생 불가 오류.** fingerprint를 만들기 전에 끝나는 다음 오류는 receipt가 없다.
        JSON 본문 16 KiB 초과 413, 잘못된 `Idempotency-Key`/`X-Mutation-Scope` 400,
        namespace 부재 404(receipt가 namespace를 참조하므로 저장 불가). 같은 요청을 재시도하면
        같은 상한과 상태에서 같은 결과가 나오지만 최초 응답 bytes와 X-Request-Id의 동일성은
        보장하지 않는다.

        412 body는 `current`(충돌 시점의 대상 노드 metadata, 없으면 null)를 포함하며
        재생 시에도 최초 값이다. 진행 중인 key는 409와 Retry-After를 반환한다.
        path, source, destination은 상단의 공통 경로 계약을 따른다.
        400 VFS_INVALID_PATH도 receipt로 저장되므로 경로를 고쳐 같은 key로 재시도하면
        409 MUTATION_KEY_REUSED이며 새 key가 필요하다.

        **persist.** 만료 예정 FILE의 만료를 해제하고 revision을 한 번 올린다(200,
        `affectedRevisions`에 새 revision). 이미 만료가 없으면 변경 없이 200이고
        `affectedRevisions`는 빈 배열이다. 만료 시각이 지났어도 GC가 삭제하기 전이면
        성공한다. DIRECTORY는 409 VFS_IS_DIRECTORY. 성공 응답을 잃고 새 key로
        재시도해 412를 받으면 `current.id`가 같은 파일이고 `current.expiresAt`이
        null인지 확인해 확정 완료를 판정할 수 있다.

        **setMimeType.** bytes·Blob·논리 사용량은 바뀌지 않고 `expiresAt`도 읽거나
        쓰지 않아 그대로 유지된다(만료 예정 FILE도 변경할 수 있다). `mimeType`은
        upload-session과 같은 엄격 검증을 거친다: 파라미터(세미콜론 등) 포함이나
        형식 오류는 조용히 대체하지 않고 400 `VFS_INVALID_MUTATION_REQUEST`로
        거부한다(ADR-0028). 이 400도 다른 요청 형식 오류와 같은 receipt 규칙을 따르므로
        같은 key 재시도는 최초 status·body·X-Request-Id를 재생하고, 유효한 값으로
        같은 key를 재사용하면 409 MUTATION_KEY_REUSED다. 요청 값이 정규화 후 현재
        저장값과 같으면 변경 없이 200이고 `affectedRevisions`는 빈 배열이다(revision을
        소모하지 않는다). 값이 실제로 바뀌면 200과 새 revision을 담은
        `affectedRevisions`(대상+조상)를 반환한다. DIRECTORY는 409 VFS_IS_DIRECTORY.
        성공 응답을 잃고 새 key로 재시도해 412를 받으면 `current.mimeType`이 이미
        바뀐 값인지 확인해 완료 여부를 판정할 수 있다.

        **copy 만료.** `expiresInSeconds`는 copy에서만 허용한다. 새로 생기는 모든 FILE에
        복사 transaction의 DB 시각 + 초를 적용하며, 생략하면 원본 만료와 관계없이
        만료가 없다. move에 보내면 400 VFS_INVALID_EXPIRY다. 만료 입력 오류는
        조건부 변경 receipt에 저장·재생된다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
          schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, path, ifAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [mkdir] }
                    path: { type: string }
                    ifAbsent: { type: boolean, enum: [true] }
                - type: object
                  required: [kind, path, ifRevision]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [delete] }
                    path: { type: string }
                    ifRevision: { type: string, pattern: '^r1\.' }
                    recursive: { type: boolean }
                - type: object
                  required: [kind, path, ifRevision]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [persist] }
                    path: { type: string }
                    ifRevision: { type: string, pattern: '^r1\.' }
                - type: object
                  required: [kind, path, ifRevision, mimeType]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [setMimeType] }
                    path: { type: string }
                    ifRevision: { type: string, pattern: '^r1\.' }
                    mimeType:
                      type: string
                      maxLength: 255
                      pattern: '^[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*/[a-zA-Z0-9][a-zA-Z0-9!#$&^_.+-]*$'
                - type: object
                  required: [kind, source, destination, sourceRevision, destinationAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [move] }
                    source: { type: string }
                    destination: { type: string }
                    sourceRevision: { type: string, pattern: '^r1\.' }
                    destinationAbsent: { type: boolean, enum: [true] }
                    destinationResolution:
                      type: string
                      enum: [exact]
                      description: 생략하면 기존 directory 아래 basename 배치, exact이면 지정 경로 자체가 없어야 한다.
                - type: object
                  required: [kind, source, destination, sourceRevision, destinationAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [copy] }
                    source: { type: string }
                    destination: { type: string }
                    sourceRevision: { type: string, pattern: '^r1\.' }
                    destinationAbsent: { type: boolean, enum: [true] }
                    destinationResolution:
                      type: string
                      enum: [exact]
                      description: 생략하면 기존 directory 아래 basename 배치, exact이면 지정 경로 자체가 없어야 한다.
                    expiresInSeconds:
                      type: integer
                      minimum: 1
                      description: copy에서만 허용한다. 설정된 MIN~MAX 범위여야 하며 move에서는 400 VFS_INVALID_EXPIRY다.
      responses:
        '200':
          description: 변경 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '201':
          description: 생성 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '400':
          description: 요청 형식 오류, 유효하지 않은 경로(`VFS_INVALID_PATH`) 또는 만료 입력 오류(`VFS_INVALID_EXPIRY`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            도메인 충돌(`VFS_NOT_DIRECTORY` 경로 중간이 파일, `VFS_DIRECTORY_NOT_EMPTY` 비재귀 delete,
            `VFS_INVALID_OPERATION` 디렉터리를 자기 subtree로 move/copy, persist·setMimeType 대상
            DIRECTORY의 `VFS_IS_DIRECTORY`, `VFS_REVISION_EXHAUSTED`)은
            receipt로 재생된다. key 재사용(`MUTATION_KEY_REUSED`)과 진행 중인 claim
            (`MUTATION_IN_PROGRESS`, Retry-After 헤더 반환)은 재생 대상이 아니다.
          headers:
            Retry-After:
              description: 진행 중인 claim의 재시도 대기 시간(초). 그 외 409에는 생략.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: revision 불일치 또는 목적지 존재(exact에서는 `/` 포함 지정 경로 자체). body의 `current`는 충돌 시점 metadata이며 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: 동기 삭제·복사 상한 초과(receipt로 재생) 또는 JSON 본문 16 KiB 초과(재생 불가)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: 필수 조건 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v2/namespaces/{namespaceId}/fs/mkdir:
    post:
      operationId: mkdir
      summary: 디렉터리 생성
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MkdirRequest'
      responses:
        '200':
          description: '`parents=true`로 요청한 이미 존재하는 디렉터리(멱등 성공)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`parents`를 생략하거나 false로 한 요청의 대상이 이미 있음(`VFS_ALREADY_EXISTS`), 경로 중간이 디렉터리가 아님(`VFS_NOT_DIRECTORY`) 등'
          content:
