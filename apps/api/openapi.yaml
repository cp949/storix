  /api/v2/namespaces/{namespaceId}/fs/content/conditional:
    post:
      operationId: putConditionalContent
      summary: 조건부 파일 콘텐츠 업로드(raw stream)
      tags: [fs]
      description: |
        이미 존재하는 부모 아래에 파일을 생성하거나 수정한다. UUID key와 scope를
        동일하게 재사용하면 저장 없이 raw body를 해시해 최초 status/body와
        X-Request-Id를 완료 시점부터 30일간 재생한다. receipt identity는
        namespace/scope/key이며 fingerprint에는 method, route, path, 조건, 정규화 MIME,
        raw body SHA-256과 지정한 `X-Content-Sha256`이 포함된다. 경로가 정규화에 실패하거나 루트 경로 `/`라 거부되면 원본 경로
        문자열이, 조건 헤더가 유효하지 않거나 경로가 거부돼 조건을 검사하지 않으면 원본 헤더 값이
        fingerprint에 들어간다.
        이 endpoint는 릴리즈된 버전에 없다. 이 fingerprint 규칙 이전의 미릴리즈 중간 빌드는
        파싱 단계 오류(428, 조건 헤더·revision 400, 유효한 헤더로 보낸 루트 경로 `/` 400)를
        조건 자리에 고정 문자열 `invalid`를 넣은 fingerprint로 저장했으므로, 그 receipt와 같은
        요청의 재시도는 최대 30일 동안 409 MUTATION_KEY_REUSED다.
        다른 요청의 key 재사용은 409 MUTATION_KEY_REUSED다. 성공 시 Node/Blob
        참조/revision 변경과 receipt는 한 transaction으로 커밋한다.

        **오류 재생.** receipt 저장 조건을 충족한 결정적 4xx는 receipt에 저장하고 저장이 끝난 뒤에만 응답한다.
        파싱 단계 오류(400 `VFS_INVALID_PATH`, 루트 경로 `/`·조건 헤더·revision 형식 400, 428)는
        claim 전에 판정해 보류하고 claim을 소유한 요청만 저장하므로, 같은 key의 완료 receipt
        (재생 또는 409 MUTATION_KEY_REUSED)와 진행 중 claim(409 MUTATION_IN_PROGRESS)이 우선한다.
        파싱 단계 오류는 업로드와 작업 transaction 없이 raw body를 끝까지 해시해 fingerprint를
        만든 뒤 저장한다. 작업 단계 오류(404 부모 부재 또는 `X-If-Revision` 대상 부재, 409, 412)는
        변경 롤백 → 업로드한 object 삭제 → 별도 transaction으로 receipt 저장 순서로 처리한다. 같은 key와
        같은 fingerprint의 재시도는 그 사이 상태가 바뀌었더라도 최초 status, body,
        X-Request-Id를 30일간 재생한다. 따라서 404·412 뒤 상태를 고치고 같은 key로
        재시도하면 최초 오류가 재생되므로 새 key를 사용해야 한다. 경로나 헤더를 고친 요청은
        fingerprint가 달라 같은 key에서 409 MUTATION_KEY_REUSED다.
        재생하지 않는 응답: 5xx(`DB_BUSY`, `STORAGE_UNAVAILABLE`, `STORAGE_FAILURE`, `INTERNAL_ERROR` 포함), 진행 중 key(409 MUTATION_IN_PROGRESS),
        409 MUTATION_KEY_REUSED, 401. `Retry-After`는 저장하지 않는다.

        **재생 불가 오류.** fingerprint(raw body SHA-256)를 만들기 전에 끝나는 다음 오류는
        receipt가 없다: `Content-Length` 형식 오류 400, 선언 길이가 파일 크기 상한을 넘는 413,
        스트리밍 중 상한 초과 413, 잘못된 `Idempotency-Key`/`X-Mutation-Scope` 400,
        잘못된 `X-Content-Sha256` 400 VFS_INVALID_CHECKSUM(본문 소비 전),
        namespace 부재 404(receipt가 namespace를 참조하므로 저장 불가). 같은 요청을 재시도하면
        같은 상한과 상태에서 같은 결과가 나오지만 최초 응답 bytes와 X-Request-Id의 동일성은
        보장하지 않는다. 파일 크기 상한 413은 재생 대상이 아니다.

        412 body는 `current`(충돌 시점의 대상 노드 metadata)를 포함하며 재생 시에도 최초 값이다.
        `X-If-Absent`와 `X-If-Revision`은 정확히 하나만 지정한다.
        path는 상단의 공통 경로 계약을 따른다.
        400 VFS_INVALID_PATH도 receipt로 저장되므로 경로를 고쳐 같은 key로 재시도하면
        409 MUTATION_KEY_REUSED이며 새 key가 필요하다.
        선택적 `X-Content-Sha256`은 저장 전 전체 평문 바이트의 SHA-256을 정확히 64자리
        소문자 hex로 지정한다. ENCRYPTED namespace도 평문 기준이다. 표현이 잘못되면
        본문 소비·receipt 생성 전에 400 VFS_INVALID_CHECKSUM으로 거부한다.
        실제 해시와 다르면 파일·revision을 변경하지 않고 422 VFS_CHECKSUM_MISMATCH를
        반환하며 기대값과 계산값은 응답에 넣지 않는다. 이 422는 body hash와 기대 checksum에
        결합한 receipt로 30일간 재생된다. body나 기대 checksum을 바꾸려면 새 key가 필요하다.
        `X-Expires-In`은 `X-If-Absent: true`와 함께만 허용하며 fingerprint에 포함된다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          description: 공통 경로 계약을 따르는 절대 파일 경로.
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
          schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
        - name: X-If-Absent
          in: header
          required: false
          schema: { type: string, enum: ['true'] }
        - name: X-If-Revision
          in: header
          required: false
          schema: { type: string, pattern: '^r1\.' }
        - name: X-Expires-In
          in: header
          required: false
          description: |
            새 FILE의 만료 초(선행 0 없는 10진 정수). 기본 범위는 60~2592000초이며
            `STORIX_VFS_EXPIRY_MIN_SECONDS`/`STORIX_VFS_EXPIRY_MAX_SECONDS`로 조정한다.
            설정 가능한 최대값은 PostgreSQL INTEGER 상한인 2147483647초다.
            `X-If-Absent: true`와 함께만 허용한다. 만료 시각은 파일 생성 transaction의
            DB 시각 + 초다. 형식·범위·조합 오류는 본문 소비와 receipt 생성 전에
            400 VFS_INVALID_EXPIRY다. 유효한 값은 receipt fingerprint에 포함된다.
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
        - name: X-Content-Sha256
          in: header
          required: false
          description: 저장 전 전체 평문 바이트의 SHA-256. ENCRYPTED namespace도 평문 기준.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 수정 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalContentResult' }
        '201':
          description: 생성 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalContentResult' }
        '400':
          description: 요청 형식 오류, 유효하지 않은 경로(`VFS_INVALID_PATH`), 만료 입력 오류(`VFS_INVALID_EXPIRY`) 또는 checksum 표현 오류(`VFS_INVALID_CHECKSUM`). 잘못된 만료 입력과 checksum은 본문 소비와 receipt 생성 전에 거부한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            도메인 충돌(`VFS_NOT_DIRECTORY` 부모 경로 중간이 파일, `VFS_IS_DIRECTORY` `X-If-Revision`이
            디렉터리 revision과 일치, `VFS_REVISION_EXHAUSTED`)은 receipt로 재생된다. key 재사용
            (`MUTATION_KEY_REUSED`)과 진행 중인 claim(`MUTATION_IN_PROGRESS`, Retry-After 반환)은
            재생 대상이 아니다.
          headers:
            Retry-After:
              description: 진행 중인 claim의 재시도 대기 시간(초). 그 외 409에는 생략.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: revision 불일치 또는 대상 존재. body의 `current`는 충돌 시점 metadata이며 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: 파일 크기 상한 초과(선언 길이 또는 스트리밍 중 초과). receipt가 없어 재생하지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 전체 평문 checksum 불일치(VFS_CHECKSUM_MISMATCH). 파일·revision은 바뀌지 않으며 body와 기대 checksum에 결합된 receipt를 재생한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: 필수 조건 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v2/namespaces/{namespaceId}/fs/content:
    post:
      operationId: putContent
      summary: 파일 콘텐츠 업로드(raw stream만 지원, `apps/api/docs/adr/0004-raw-stream-upload-only.md`)
      description: 만료 입력은 조건부 생성에서만 허용한다. `X-Expires-In`을 보내면 400 VFS_INVALID_EXPIRY다.
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: parents
          in: query
          required: false
          description: 상위 디렉터리가 없으면 함께 생성할지 여부.
          schema:
            type: boolean
            default: false
        - name: force
          in: query
          required: false
          description: '`If-Match` 없이도 기존 콘텐츠를 덮어쓸지 여부.'
          schema:
            type: boolean
            default: false
        - name: If-Match
          in: header
          required: false
          description: |
            낙관적 동시성 제어용 `version`(`VfsNode.version`). 값이 있는데 현재
            version과 다르면 409(`VFS_VERSION_CONFLICT`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: |
          임의의 `Content-Type`을 그대로 저장했다가 다운로드 시 재현한다
          (`multipart/form-data`는 지원하지 않음).
      responses:
        '200':
          description: 기존 파일 갱신
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          description: 잘못된 요청. `X-Expires-In`을 보내면 `VFS_INVALID_EXPIRY`다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리이거나(`VFS_IS_DIRECTORY`) `If-Match` version 불일치(`VFS_VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 파일 크기가 상한을 초과함(`VFS_FILE_TOO_LARGE`). 상한은 배포/namespace별 설정값.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getContent
      summary: 파일 콘텐츠 조회(Range 지원, 인라인)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 전체 콘텐츠
          headers:
            Content-Type:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            X-Storix-File-Id:
              description: 반환한 파일의 안정적인 VFS 노드 UUID. 같은 경로를 삭제 후 재생성하면 새 ID다.
              schema: { type: string, format: uuid }
            X-Storix-Revision:
              description: 반환한 파일 상태의 불투명 revision 토큰.
              schema: { type: string, pattern: '^r1\.[A-Za-z0-9_-]{32}$' }
            X-Storix-Sha256:
              description: 반환한 전체 원본 바이트의 SHA-256 소문자 hex. ENCRYPTED 파일은 복호화된 바이트 기준이다.
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 부분 콘텐츠(`Range` 요청)
          headers:
            Content-Range:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            X-Storix-File-Id:
              description: 반환한 바이트가 속한 파일의 안정적인 VFS 노드 UUID.
              schema: { type: string, format: uuid }
            X-Storix-Revision:
              description: 반환한 바이트가 속한 파일 상태의 불투명 revision 토큰.
              schema: { type: string, pattern: '^r1\.[A-Za-z0-9_-]{32}$' }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리임(`VFS_IS_DIRECTORY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: 처리할 수 없는 Range(`VFS_RANGE_NOT_SATISFIABLE`)
          headers:
            Content-Range:
              description: '거부된 Range의 전체 표현 길이: `bytes */<전체 길이>`.'
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/upload-sessions:
    post:
      operationId: createUploadSession
      tags: [fs]
      summary: 재개 업로드 세션 생성
      description: |
        서비스 Bearer key가 필요하다. `resumable-upload`는 기본 비활성이며 전역·namespace
        허용과 세션 정책이 있어야 새 세션을 만든다. 경로·크기·MIME·조건·전체 checksum·조각 크기는
        생성 뒤 고정된다. 0-byte 파일은 조각 없이 완료한다. 부모 디렉터리는 존재해야 한다.
        파일 크기는 namespace 적용 상한과 전역 기본 5 GiB 상한 중 낮은 값을 따르고,
        생성 JSON에는 16 KiB 본문 한도가 적용된다.
        선택적 `expiresInSeconds`는 `ifAbsent: true`와 함께만 허용한다. 생성 시 기본
        60~2592000초 범위(설정 상한 최대 2147483647초)를 검사하고 세션에 고정한다.
        FILE의 만료 시각은 업로드 완료 커밋의 DB 시각 + 초다. 값은 생성 요청의
        fingerprint에 포함되므로 동일 key에서 바꾸면 409 MUTATION_KEY_REUSED다.
        선택적 sha256은 저장 전 전체 평문 바이트(ENCRYPTED namespace 포함)의 SHA-256을
        64자리 소문자 hex로 지정한다. 잘못된 표현은 세션 생성 전에 400 VFS_INVALID_CHECKSUM이다.
        같은 namespace/scope/key와 정규화된 동일 요청(checksum 포함)은 세션이 FAILED로 끝난 뒤에도
        최초 201 본문(state OPEN, 최초 만료 시각 포함)과 X-Request-Id를 재생한다.
        현재 상태는 GET으로 조회한다. 다른 요청은 409 MUTATION_KEY_REUSED다. 기존 세션의
        동일 요청 재생은 capability 비활성화 뒤에도 가능하다. 아래 응답 예시는
        설명을 위해 partSizeBytes=4로 설정한 정책을 사용한다(기본 16777216 bytes).
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 비어 있지 않은 최대 128 UTF-8 bytes 문자열
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadSessionCreateRequest' }
            example: { path: /large.bin, sizeBytes: '4', mimeType: application/octet-stream, ifAbsent: true }
      responses:
        '201':
          description: 생성 또는 동일 요청 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionCreated' }
              example:
                sessionId: 33333333-3333-4333-8333-333333333333
                state: OPEN
                partSizeBytes: 4
                partCount: 1
                expiresAt: '2026-09-28T00:00:00.000Z'
                maxExpiresAt: '2026-10-04T00:00:00.000Z'
        '400':
          description: UUID/scope, JSON, 경로, MIME, 크기, 조건, 만료 입력 오류(VFS_INVALID_EXPIRY) 또는 sha256 표현 오류(VFS_INVALID_CHECKSUM). 잘못된 값은 세션을 만들지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: VFS_FEATURE_DISABLED 또는 MUTATION_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: 생성 시점 조건 불일치(VFS_PRECONDITION_FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: VFS_FILE_TOO_LARGE 또는 JSON 본문 크기 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: ifAbsent/ifRevision 조건 누락(VFS_PRECONDITION_REQUIRED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: 활성 세션 수 상한 초과(VFS_UPLOAD_SESSION_LIMIT_EXCEEDED)
          headers:
            Retry-After: { schema: { type: integer, enum: [1] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: 일시적 DB 또는 storage 장애(DB_BUSY, STORAGE_UNAVAILABLE); Retry-After는 있을 때만 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v2/namespaces/{namespaceId}/fs/upload-sessions/{sessionId}:
    get:
      operationId: getUploadSession
      tags: [fs]
      summary: 재개 업로드 세션 상태 조회
      description: |
        capability 비활성화 뒤에도 조회할 수 있다. 저장된 조각의 index와 크기만 공개하며
        staging key, digest, 암호화 IV와 기대·계산 checksum은 공개하지 않는다. checksum 불일치로
        종료된 세션은 state FAILED와 failure.code VFS_CHECKSUM_MISMATCH만 공개한다.
        종결 결과는 종결 시점부터 최소 30일 보존하며, 조각 정리가 끝나야 제거한다.
        예시는 설명을 위해 전역 업로드 세션 정책의 partSizeBytes=4로 설정하고 `test` 4바이트를
        index 0에 저장한 상태다. 기본 조각 크기는 16777216 bytes다. 요청은
        `GET .../upload-sessions/33333333-3333-4333-8333-333333333333`이다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/UploadSessionId'
      responses:
        '200':
          description: 세션 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionStatus' }
              example:
                sessionId: 33333333-3333-4333-8333-333333333333
                state: OPEN
                partSizeBytes: 4
                partCount: 1
                expiresAt: '2026-09-28T00:00:00.000Z'
                maxExpiresAt: '2026-10-04T00:00:00.000Z'
                path: /large.bin
                sizeBytes: '4'
                mimeType: application/octet-stream
                condition: { ifAbsent: true }
                parts: [{ index: 0, sizeBytes: '4' }]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: namespace 없음(NAMESPACE_NOT_FOUND) 또는 세션 없음(VFS_UPLOAD_SESSION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: 일시적 DB 장애(DB_BUSY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: cancelUploadSession
      tags: [fs]
      summary: 열린 업로드 세션 취소
      description: |
        capability 비활성화 뒤에도 가능하다. OPEN만 CANCELLED로 바꾸며 반복 취소는
        현재 CANCELLED 상태를 반환한다. FINALIZING, COMPLETED, EXPIRED는 409다.
        FAILED도 409 VFS_UPLOAD_SESSION_CLOSED다. 실제 staging 객체 삭제는 GC가 재시도한다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/UploadSessionId'
      responses:
        '200':
          description: 취소된 세션의 현재 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 다른 종결 상태이거나 완료 중(VFS_UPLOAD_SESSION_CLOSED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: 일시적 DB 장애(DB_BUSY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v2/namespaces/{namespaceId}/fs/upload-sessions/{sessionId}/parts/{index}:
    put:
      operationId: putUploadSessionPart
      tags: [fs]
      summary: 조각 저장 또는 동일 조각 재전송
      description: |
        `resumable-upload`가 활성일 때 OPEN 세션에만 저장한다. index는 0부터 시작하고
        마지막 조각 외에는 세션의 partSizeBytes와 정확히 같다. Content-Length와 실제
        스트림 크기를 모두 검사한다. 동일 index·평문 SHA-256의 재전송은 본문을 다시
        읽어 검증하고 replayed=true를 반환한다. 성공한 저장·재전송은 비활동 만료를
        최대 수명 이내에서 갱신한다. 조각 요청은 생성의 Idempotency-Key를 쓰지 않는다.
        각 조각 요청은 STORIX_MUTATION_MAX_UPLOAD_SECONDS(기본 86400초) 안에 끝나야 한다.
        아래 예시는 partSizeBytes=4로 설정한 세션의 index 0에 ASCII `test`(4 bytes)를
        `PUT .../upload-sessions/33333333-3333-4333-8333-333333333333/parts/0`으로
        보내는 요청과 응답이다. 기본 조각 크기는 16777216 bytes다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/UploadSessionId'
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, example: 0 }
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 0, example: 4 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
            example: test
      responses:
        '200':
          description: 저장 또는 동일 조각 재전송
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadPartResult' }
              example:
                index: 0
                sizeBytes: '4'
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                replayed: false
        '400':
          description: 잘못된 Content-Type/Length/index/조각 크기(VFS_INVALID_MUTATION_REQUEST 또는 VFS_INVALID_UPLOAD_PART)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: VFS_FEATURE_DISABLED, VFS_UPLOAD_SESSION_CLOSED, VFS_UPLOAD_PART_CONFLICT 또는 VFS_UPLOAD_PART_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: VFS_UPLOAD_STAGING_LIMIT_EXCEEDED 또는 스트림 초과(VFS_FILE_TOO_LARGE). 정착 여부가 불명확한 이전 staging PUT 예약량은 자동 해제되지 않으므로 이 오류가 반복될 수 있다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: 일시적 DB 또는 storage 장애(DB_BUSY, STORAGE_UNAVAILABLE); Retry-After는 있을 때만 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v2/namespaces/{namespaceId}/fs/upload-sessions/{sessionId}/complete:
    post:
      operationId: completeUploadSession
      tags: [fs]
      summary: 저장된 조각을 검증하고 파일 원자 공개
      description: |
        조각을 순서대로 읽고 크기·평문 SHA-256을 검증한다. 세션에 sha256이 있으면
        저장 전 전체 평문 해시와 비교하고, 불일치 시 파일·revision 변경 없이
        422 VFS_CHECKSUM_MISMATCH로 FAILED에 종결한다. 최초 422 body와 X-Request-Id는
        반복 완료에서 재생하며 GET 상태는 failure.code만 공개한다. 실패한 세션은 조각
        정리를 시작하고 실제 삭제가 확인되기 전 조각 바이트는 임시 사용량에 포함한다.
        모든 조각이 저장된 기존
        세션은 capability 비활성화 뒤에도 완료할 수 있다. 생성 때 고정한 조건과
        namespace 논리 quota를 완료 시점에 재검사한다. Node/Blob/revision/usage와
        완료 결과는 한 DB 트랜잭션으로 확정한다. 같은 세션의 반복 완료는 최초
        status, body, X-Request-Id를 재생한다. 진행 중 완료는 409이며 재시도할 수 있다.
        본문 없이 `POST .../upload-sessions/33333333-3333-4333-8333-333333333333/complete`를
        호출한다. 아래 201 예시는 위 4-byte `test` 조각을 새 `/large.bin`에 공개한 결과다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/UploadSessionId'
      responses:
        '200':
          description: 기존 파일 교체 또는 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionCompleteResult' }
        '201':
          description: 새 파일 생성 또는 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionCompleteResult' }
              example:
                resource:
                  id: 22222222-2222-4222-8222-222222222222
                  path: /large.bin
                  name: large.bin
                  type: FILE
                  size: 4
                  mimeType: application/octet-stream
                  createdAt: '2026-09-27T00:00:01.000Z'
                  updatedAt: '2026-09-27T00:00:01.000Z'
                  version: 1
                  revision: r1.IiIiIiIiQiKCIiIiIiIiIgAAAAAAAAAB
                affectedRevisions:
                  - { path: /large.bin, revision: r1.IiIiIiIiQiKCIiIiIiIiIgAAAAAAAAAB }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: VFS_UPLOAD_PARTS_INCOMPLETE, VFS_UPLOAD_SESSION_IN_PROGRESS, VFS_UPLOAD_SESSION_CLOSED 또는 경로 상태 충돌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: 완료 시점 조건 불일치(VFS_PRECONDITION_FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: namespace 논리 quota 초과(VFS_QUOTA_EXCEEDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 저장 전 전체 평문 checksum 불일치(VFS_CHECKSUM_MISMATCH). FAILED 완료 결과로 30일간 재생한다.
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: 일시적 DB 또는 storage 장애(DB_BUSY, STORAGE_UNAVAILABLE); Retry-After는 있을 때만 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v2/namespaces/{namespaceId}/fs/download:
    get:
      operationId: download
      summary: '파일 콘텐츠 다운로드(Range 지원, `Content-Disposition: attachment`)'
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 전체 콘텐츠
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
