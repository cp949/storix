openapi: 3.0.3
info:
  title: Storix API
  version: 0.1.0-draft
  description: |
    Storix는 호출 서버가 사용하는 독립 VFS(Virtual File System) 저장 서버다. 파일의
    업무적 의미와 최종 사용자 인증·권한 판단은 호출 서버의 책임이며 Storix 도메인에
    포함하지 않는다. 용어 정의는 `apps/api/CONTEXT.md` 참고.

    **초안 상태**: apps/demo로 이 API 모양이 실사용 검증되기 전에 작성됐다
    (`docs/ROADMAP.md`의 "실행 순서" 참고). demo 피드백에 따라 breaking change가
    발생할 수 있다.

    이 스펙은 `namespace`/`fs` 컨트롤러만 다룬다. `/health/*`(인증 예외 대상)와
    `/metrics`(운영 관측용)는 외부 API 계약이 아니라서 포함하지 않는다.

    **파일·스냅샷 경로 계약.** 공개 경로 입력은 `/`로 시작하는 절대경로다. TREE snapshot
    content의 `path`만 상대경로이며 `.`은 TREE 루트다. 중복 `/`, `.` 구간, 끝 `/`는
    제거해 같은 정규 경로로 식별한다. `..`, 백슬래시, C0·C1·DEL 제어 문자,
    Unicode Bidi_Control, 고립 surrogate 및 NFC가 아닌 이름은 정규화하지 않고
    400 `VFS_INVALID_PATH`로 거부한다. 이름은 대소문자를 구별하며 각각 UTF-8
    최대 255바이트다. 정규 절대경로는 앞 `/`를 포함해 UTF-8 최대 4096바이트이고,
    TREE 상대경로도 앞에 `/`를 붙인 길이로 검사한다. 이동·복사로 만들어질 최종
    경로와 모든 하위 경로에도 같은 한도를 적용한다. 경로 오류로 실패하면 파일
    트리·본문·snapshot은 변경되지 않는다. 조건부 변경의 오류 receipt는 해당
    endpoint의 재생 계약을 따른다. 부모 디렉터리는 기본적으로 생성하지 않으며
    `parents` 또는 `destinationParents`가 있는 작업에서 명시적으로 `true`로
    지정할 때만 생성한다. `/`는 조회·목록·TREE snapshot 원본과 이동·복사의
    디렉터리 목적지로 사용할 수 있다. 루트 자체를 파일로 쓰거나 이동·삭제할 수는 없다.

    SQLite는 단일 서버 인스턴스 배포 전제다. 여러 서버 인스턴스는 공유
    PostgreSQL과 Blob 저장소를 사용한다. SQLite는 모든 쿼리를 한 줄로 직렬화하며,
    앞선 트랜잭션이 30초를 넘게 끝나지 않으면 대기 중인 요청은 503 `DB_BUSY`와
    `Retry-After: 1`로 실패한다(재시도 가능, receipt로 저장하지 않음). PostgreSQL에서는 나오지 않는다.
  license:
    name: UNLICENSED
paths:
  /api/v2/namespaces:
    post:
      operationId: createNamespace
      summary: Namespace 생성
      description: |
        `Idempotency-Key` 헤더가 필수다. 같은 키와 같은 요청 본문의 재시도 또는
        동시 요청은 하나의 생성 결과로 수렴하며 최초 201 응답을 재생한다. 같은 키에
        다른 본문을 보내면 422를 반환한다. `maxTotalLogicalBytes`는 선택적 namespace 상한이며
        생략하면 전역 상한을 사용한다. 바이트 값은 10진수 문자열이다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceRequest'
      responses:
        '201':
          description: 생성됨(또는 같은 Idempotency-Key의 재생 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 같은 name의 Namespace가 이미 존재함(`NAMESPACE_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 같은 `Idempotency-Key`가 다른 요청 본문에 재사용됨(`IDEMPOTENCY_KEY_REUSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listNamespaces
      summary: Namespace 목록 조회
      description: status가 `ACTIVE`인 Namespace만 name 오름차순으로 반환한다. 페이지네이션 없음.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{id}:
    get:
      operationId: getNamespace
      summary: Namespace 단건 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/admin/namespaces/{namespaceId}/quota:
    patch:
      operationId: updateNamespaceQuota
      summary: Namespace 논리 사용량 상한 변경
      description: '별도 `STORIX_ADMIN_API_KEY` 인증과 `Idempotency-Key`가 필요하다. `maxTotalLogicalBytes: null`은 전역 상한 상속을 뜻한다.'
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [maxTotalLogicalBytes]
              properties:
                maxTotalLogicalBytes:
                  type: string
                  nullable: true
                  pattern: '^[1-9][0-9]*$'
                  description: null이면 전역 상한을 상속한다.
      responses:
        '200':
          description: 변경 또는 동일 키 응답 재생
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Namespace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 같은 key를 다른 요청에 재사용함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v2/namespaces/{namespaceId}/fs/mutations:
    post:
      operationId: conditionalMutation
      summary: 조건부 VFS 변경
      tags: [fs]
      description: |
        mkdir/delete/move/copy를 원자적으로 적용한다. 같은 scope와 UUID key의
        같은 raw JSON bytes는 최초 status, body, X-Request-Id를 완료 시점부터 30일간 재생한다.
        receipt identity는 namespace/scope/key이며 fingerprint에는 method, route,
        정규화 command와 exact raw JSON SHA-256이 포함된다. 다른 요청으로 key를
        재사용하면 409 MUTATION_KEY_REUSED다. 성공 시 Node/Blob 참조/revision 변경과
        receipt는 한 transaction으로 커밋한다.

        **오류 재생.** 요청 파싱·작업 단계의 결정적 4xx(400 `VFS_INVALID_PATH`와
        요청 형식 오류, 404, 409, 412, 428, 상한 초과 413)는 receipt에 저장하고, 저장이 끝난
        뒤에만 응답한다. 파싱은 claim 전에 실행하고 그 오류는 claim을 소유한 요청만 저장하므로,
        같은 key의 완료 receipt(재생 또는 409 MUTATION_KEY_REUSED)와 진행 중 claim
        (409 MUTATION_IN_PROGRESS)이 파싱 오류보다 우선한다. 작업 단계 오류는 변경을 롤백한 뒤
        별도 transaction으로 저장한다. 같은 key와 같은
        fingerprint의 재시도는 그 사이 상태가 바뀌었더라도 최초 status, body,
        X-Request-Id를 완료 시점부터 30일간 재생한다. 따라서 404·412·413 뒤 상태를 고치고
        같은 key로 재시도하면 최초 오류가 재생되므로 새 key를 사용해야 한다. 경로를 고친
        요청은 fingerprint가 달라 같은 key에서 409 MUTATION_KEY_REUSED다.
        재생하지 않는 응답: 5xx, DB/storage 일시 오류, 진행 중 key(409 MUTATION_IN_PROGRESS),
        409 MUTATION_KEY_REUSED, 401. 이 응답들은 receipt를 남기지 않고 재시도가 다시 평가한다.
        `Retry-After`는 저장하지 않는다.

        **재생 불가 오류.** fingerprint를 만들기 전에 끝나는 다음 오류는 receipt가 없다.
        JSON 본문 16 KiB 초과 413, 잘못된 `Idempotency-Key`/`X-Mutation-Scope` 400,
        namespace 부재 404(receipt가 namespace를 참조하므로 저장 불가). 같은 요청을 재시도하면
        같은 상한과 상태에서 같은 결과가 나오지만 최초 응답 bytes와 X-Request-Id의 동일성은
        보장하지 않는다.

        412 body는 `current`(충돌 시점의 대상 노드 metadata, 없으면 null)를 포함하며
        재생 시에도 최초 값이다. 진행 중인 key는 409와 Retry-After를 반환한다.
        path, source, destination은 상단의 공통 경로 계약을 따른다.
        400 VFS_INVALID_PATH도 receipt로 저장되므로 경로를 고쳐 같은 key로 재시도하면
        409 MUTATION_KEY_REUSED이며 새 key가 필요하다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
          schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, path, ifAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [mkdir] }
                    path: { type: string }
                    ifAbsent: { type: boolean, enum: [true] }
                - type: object
                  required: [kind, path, ifRevision]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [delete] }
                    path: { type: string }
                    ifRevision: { type: string, pattern: '^r1\.' }
                    recursive: { type: boolean }
                - type: object
                  required: [kind, source, destination, sourceRevision, destinationAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [move, copy] }
                    source: { type: string }
                    destination: { type: string }
                    sourceRevision: { type: string, pattern: '^r1\.' }
                    destinationAbsent: { type: boolean, enum: [true] }
      responses:
        '200':
          description: 변경 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '201':
          description: 생성 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '400':
          description: 요청 형식 오류 또는 유효하지 않은 경로(`VFS_INVALID_PATH`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            도메인 충돌(`VFS_NOT_DIRECTORY` 경로 중간이 파일, `VFS_DIRECTORY_NOT_EMPTY` 비재귀 delete,
            `VFS_INVALID_OPERATION` 디렉터리를 자기 subtree로 move/copy, `VFS_REVISION_EXHAUSTED`)은
            receipt로 재생된다. key 재사용(`MUTATION_KEY_REUSED`)과 진행 중인 claim
            (`MUTATION_IN_PROGRESS`, Retry-After 헤더 반환)은 재생 대상이 아니다.
          headers:
            Retry-After:
              description: 진행 중인 claim의 재시도 대기 시간(초). 그 외 409에는 생략.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: revision 불일치 또는 목적지 존재. body의 `current`는 충돌 시점 metadata이며 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: 동기 삭제·복사 상한 초과(receipt로 재생) 또는 JSON 본문 16 KiB 초과(재생 불가)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: 필수 조건 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v2/namespaces/{namespaceId}/fs/mkdir:
    post:
      operationId: mkdir
      summary: 디렉터리 생성
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MkdirRequest'
      responses:
        '200':
          description: 이미 존재하는 디렉터리(멱등 성공)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/touch:
    post:
      operationId: touch
      summary: 빈 파일 생성(이미 존재하면 내용은 바꾸지 않음)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchRequest'
      responses:
        '200':
          description: 이미 존재하는 파일(멱등 성공)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/mv:
    post:
      operationId: move
      summary: 파일/디렉터리 이동
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/cp:
    post:
      operationId: copy
      summary: 파일/디렉터리 복사(Blob-level Copy-on-Write, `apps/api/docs/adr/0003-file-copy-blob-level-cow.md`)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 복사 대상 Node 수가 namespace/전역 상한을 초과함(`VFS_COPY_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/rmdir:
    post:
      operationId: rmdir
      summary: 빈 디렉터리 삭제
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 삭제됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 디렉터리가 비어있지 않거나(`VFS_DIRECTORY_NOT_EMPTY`) root 대상 연산(`VFS_INVALID_OPERATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/rm:
    post:
      operationId: rm
      summary: 파일/디렉터리 삭제
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: 디렉터리를 재귀적으로 삭제할지 여부. 기본 `false`(빈 디렉터리만 허용).
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: 삭제됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 삭제 대상 Node 수가 namespace/전역 상한을 초과함(`VFS_DELETE_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/content/conditional:
    post:
      operationId: putConditionalContent
      summary: 조건부 파일 콘텐츠 업로드(raw stream)
      tags: [fs]
      description: |
        이미 존재하는 부모 아래에 파일을 생성하거나 수정한다. UUID key와 scope를
        동일하게 재사용하면 저장 없이 raw body를 해시해 최초 status/body와
        X-Request-Id를 완료 시점부터 30일간 재생한다. receipt identity는
        namespace/scope/key이며 fingerprint에는 method, route, path, 조건, 정규화 MIME,
        raw body SHA-256이 포함된다. 경로가 정규화에 실패하거나 루트 경로 `/`라 거부되면 원본 경로
        문자열이, 조건 헤더가 유효하지 않거나 경로가 거부돼 조건을 검사하지 않으면 원본 헤더 값이
        fingerprint에 들어간다.
        이 endpoint는 릴리즈된 버전에 없다. 이 fingerprint 규칙 이전의 미릴리즈 중간 빌드는
        파싱 단계 오류(428, 조건 헤더·revision 400, 유효한 헤더로 보낸 루트 경로 `/` 400)를
        조건 자리에 고정 문자열 `invalid`를 넣은 fingerprint로 저장했으므로, 그 receipt와 같은
        요청의 재시도는 최대 30일 동안 409 MUTATION_KEY_REUSED다.
        다른 요청의 key 재사용은 409 MUTATION_KEY_REUSED다. 성공 시 Node/Blob
        참조/revision 변경과 receipt는 한 transaction으로 커밋한다.

        **오류 재생.** 결정적 4xx는 receipt에 저장하고 저장이 끝난 뒤에만 응답한다.
        파싱 단계 오류(400 `VFS_INVALID_PATH`, 루트 경로 `/`·조건 헤더·revision 형식 400, 428)는
        claim 전에 판정해 보류하고 claim을 소유한 요청만 저장하므로, 같은 key의 완료 receipt
        (재생 또는 409 MUTATION_KEY_REUSED)와 진행 중 claim(409 MUTATION_IN_PROGRESS)이 우선한다.
        파싱 단계 오류는 업로드와 작업 transaction 없이 raw body를 끝까지 해시해 fingerprint를
        만든 뒤 저장한다. 작업 단계 오류(404 부모 부재 또는 `X-If-Revision` 대상 부재, 409, 412)는
        변경 롤백 → 업로드한 object 삭제 → 별도 transaction으로 receipt 저장 순서로 처리한다. 같은 key와
        같은 fingerprint의 재시도는 그 사이 상태가 바뀌었더라도 최초 status, body,
        X-Request-Id를 30일간 재생한다. 따라서 404·412 뒤 상태를 고치고 같은 key로
        재시도하면 최초 오류가 재생되므로 새 key를 사용해야 한다. 경로나 헤더를 고친 요청은
        fingerprint가 달라 같은 key에서 409 MUTATION_KEY_REUSED다.
        재생하지 않는 응답: 5xx, DB/storage 일시 오류, 진행 중 key(409 MUTATION_IN_PROGRESS),
        409 MUTATION_KEY_REUSED, 401. `Retry-After`는 저장하지 않는다.

        **재생 불가 오류.** fingerprint(raw body SHA-256)를 만들기 전에 끝나는 다음 오류는
        receipt가 없다: `Content-Length` 형식 오류 400, 선언 길이가 파일 크기 상한을 넘는 413,
        스트리밍 중 상한 초과 413, 잘못된 `Idempotency-Key`/`X-Mutation-Scope` 400,
        namespace 부재 404(receipt가 namespace를 참조하므로 저장 불가). 같은 요청을 재시도하면
        같은 상한과 상태에서 같은 결과가 나오지만 최초 응답 bytes와 X-Request-Id의 동일성은
        보장하지 않는다. 파일 크기 상한 413은 재생 대상이 아니다.

        412 body는 `current`(충돌 시점의 대상 노드 metadata)를 포함하며 재생 시에도 최초 값이다.
        `X-If-Absent`와 `X-If-Revision`은 정확히 하나만 지정한다.
        path는 상단의 공통 경로 계약을 따른다.
        400 VFS_INVALID_PATH도 receipt로 저장되므로 경로를 고쳐 같은 key로 재시도하면
        409 MUTATION_KEY_REUSED이며 새 key가 필요하다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          description: 공통 경로 계약을 따르는 절대 파일 경로.
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
          schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
        - name: X-If-Absent
          in: header
          required: false
          schema: { type: string, enum: ['true'] }
        - name: X-If-Revision
          in: header
          required: false
          schema: { type: string, pattern: '^r1\.' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 수정 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalContentResult' }
        '201':
          description: 생성 또는 동일 요청의 최초 응답 재생
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalContentResult' }
        '400':
          description: 요청 형식 오류 또는 유효하지 않은 경로(`VFS_INVALID_PATH`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            도메인 충돌(`VFS_NOT_DIRECTORY` 부모 경로 중간이 파일, `VFS_IS_DIRECTORY` `X-If-Revision`이
            디렉터리 revision과 일치, `VFS_REVISION_EXHAUSTED`)은 receipt로 재생된다. key 재사용
            (`MUTATION_KEY_REUSED`)과 진행 중인 claim(`MUTATION_IN_PROGRESS`, Retry-After 반환)은
            재생 대상이 아니다.
          headers:
            Retry-After:
              description: 진행 중인 claim의 재시도 대기 시간(초). 그 외 409에는 생략.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: revision 불일치 또는 대상 존재. body의 `current`는 충돌 시점 metadata이며 receipt로 재생된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionFailedResponse' }
        '413':
          description: 파일 크기 상한 초과(선언 길이 또는 스트리밍 중 초과). receipt가 없어 재생하지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: 필수 조건 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v2/namespaces/{namespaceId}/fs/content:
    post:
      operationId: putContent
      summary: 파일 콘텐츠 업로드(raw stream만 지원, `apps/api/docs/adr/0004-raw-stream-upload-only.md`)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: parents
          in: query
          required: false
          description: 상위 디렉터리가 없으면 함께 생성할지 여부.
          schema:
            type: boolean
            default: false
        - name: force
          in: query
          required: false
          description: '`If-Match` 없이도 기존 콘텐츠를 덮어쓸지 여부.'
          schema:
            type: boolean
            default: false
        - name: If-Match
          in: header
          required: false
          description: |
            낙관적 동시성 제어용 `version`(`VfsNode.version`). 값이 있는데 현재
            version과 다르면 409(`VFS_VERSION_CONFLICT`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: |
          임의의 `Content-Type`을 그대로 저장했다가 다운로드 시 재현한다
          (`multipart/form-data`는 지원하지 않음).
      responses:
        '200':
          description: 기존 파일 갱신
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리이거나(`VFS_IS_DIRECTORY`) `If-Match` version 불일치(`VFS_VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 파일 크기가 상한을 초과함(`VFS_FILE_TOO_LARGE`). 상한은 배포/namespace별 설정값.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getContent
      summary: 파일 콘텐츠 조회(Range 지원, 인라인)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 전체 콘텐츠
          headers:
            Content-Type:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            X-Storix-File-Id:
              description: 반환한 파일의 안정적인 VFS 노드 UUID. 같은 경로를 삭제 후 재생성하면 새 ID다.
              schema: { type: string, format: uuid }
            X-Storix-Revision:
              description: 반환한 파일 상태의 불투명 revision 토큰.
              schema: { type: string, pattern: '^r1\.[A-Za-z0-9_-]{32}$' }
            X-Storix-Sha256:
              description: 반환한 전체 원본 바이트의 SHA-256 소문자 hex. ENCRYPTED 파일은 복호화된 바이트 기준이다.
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 부분 콘텐츠(`Range` 요청)
          headers:
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리임(`VFS_IS_DIRECTORY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: 처리할 수 없는 Range(`VFS_RANGE_NOT_SATISFIABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
