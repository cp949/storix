        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v2/namespaces/{namespaceId}/fs/changes:
    get:
      operationId: listNamespaceChanges
      summary: namespace 변경 checkpoint 발급 및 변경 feed 페이지 조회
      description: |
        `change-feed` capability가 활성인 ACTIVE namespace에서만 조회한다. cursor 없이
        호출하면 현재 sequence의 checkpoint와 빈 changes를 반환한다. 이 checkpoint를
        전체 `ls` 열거 전에 보존하고, 열거 후 같은 cursor로 변경을 재생한다. cursor가
        있으면 해당 sequence 이후의 이벤트를 오름차순으로 반환한다. 각 페이지의
        `nextCursor`는 마지막 이벤트를 가리키고 빈 페이지에서는 입력 cursor를 유지한다.
        소비자는 페이지 적용과 cursor 저장을 원자적으로 처리하며 sequence로 중복을 제거한다.
        만료된 cursor는 버리고 checkpoint부터 전체 열거를 다시 한다.
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 불투명 nextCursor. 내부 형식을 해석하지 않는다.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: checkpoint 또는 변경 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeFeedPage' }
        '400':
          description: 잘못되거나 변조된 cursor 또는 다른 namespace cursor (`VFS_INVALID_CURSOR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: change-feed capability 비활성 (`VFS_FEATURE_DISABLED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410':
          description: 보존 경계 이전 cursor (`VFS_CHANGE_CURSOR_EXPIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v2/namespaces/{namespaceId}/fs/ls:
    get:
      operationId: ls
      summary: 디렉터리 자식 목록 조회(1단계, cursor 페이지네이션)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: false
          description: 생략 시 namespace root.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: consistency
          in: query
          required: false
          description: '`revision`이면 디렉터리 revision에 묶인 `rc1.` cursor를 사용한다. 생략 시 기존 응답·cursor 계약을 유지한다.'
          schema: { type: string, enum: [revision] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VfsNodePage'
                  - $ref: '#/components/schemas/RevisionVfsNodePage'
        '400':
          description: 경로가 유효하지 않거나(`VFS_INVALID_PATH`) cursor가 유효하지 않음(`VFS_INVALID_CURSOR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리가 아님(`VFS_NOT_DIRECTORY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: cursor의 디렉터리 revision이 현재와 다름(`VFS_PRECONDITION_FAILED`). body의 `current`는 현재 디렉터리 metadata다. 조회 API라 receipt는 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreconditionFailedResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v2/namespaces/{namespaceId}/fs/stat:
    get:
      operationId: stat
      summary: 파일/디렉터리 메타데이터 조회
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
