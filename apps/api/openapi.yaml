openapi: 3.0.3
info:
  title: Storix API
  version: 0.1.0-draft
  description: |
    Storix는 호출 서버가 사용하는 독립 VFS(Virtual File System) 저장 서버다. 파일의
    업무적 의미와 최종 사용자 인증·권한 판단은 호출 서버의 책임이며 Storix 도메인에
    포함하지 않는다. 용어 정의는 `apps/api/CONTEXT.md` 참고.

    **초안 상태**: apps/demo로 이 API 모양이 실사용 검증되기 전에 작성됐다
    (`docs/ROADMAP.md`의 "실행 순서" 참고). demo 피드백에 따라 breaking change가
    발생할 수 있다.

    이 스펙은 `namespace`/`fs` 컨트롤러만 다룬다. `/health/*`(인증 예외 대상)와
    `/metrics`(운영 관측용)는 외부 API 계약이 아니라서 포함하지 않는다.

    SQLite는 단일 서버 인스턴스 배포 전제다. 여러 서버 인스턴스는 공유
    PostgreSQL과 Blob 저장소를 사용한다.
  license:
    name: UNLICENSED
paths:
  /api/v1/namespaces:
    post:
      operationId: createNamespace
      summary: Namespace 생성
      description: |
        `Idempotency-Key` 헤더가 필수다. 같은 키로 같은 요청 본문을 재전송하면
        최초 생성 시의 응답(항상 201)을 그대로 재생한다. 같은 키에 다른 본문을
        재전송하면 422를 반환한다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceRequest'
      responses:
        '201':
          description: 생성됨(또는 같은 Idempotency-Key의 재생 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 같은 name의 Namespace가 이미 존재함(`NAMESPACE_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 같은 `Idempotency-Key`가 다른 요청 본문에 재사용됨(`IDEMPOTENCY_KEY_REUSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listNamespaces
      summary: Namespace 목록 조회
      description: status가 `ACTIVE`인 Namespace만 name 오름차순으로 반환한다. 페이지네이션 없음.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{id}:
    get:
      operationId: getNamespace
      summary: Namespace 단건 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/mutations:
    post:
      operationId: conditionalMutation
      summary: 조건부 VFS 변경
      tags: [fs]
      description: |
        mkdir/delete/move/copy를 원자적으로 적용한다. 같은 scope와 UUID key의
        같은 raw JSON bytes는 최초 status, body, X-Request-Id를 30일간 재생한다.
        진행 중인 key는 409와 Retry-After를 반환한다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
          schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, path, ifAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [mkdir] }
                    path: { type: string }
                    ifAbsent: { type: boolean, enum: [true] }
                - type: object
                  required: [kind, path, ifRevision]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [delete] }
                    path: { type: string }
                    ifRevision: { type: string, pattern: '^r1\.' }
                    recursive: { type: boolean }
                - type: object
                  required: [kind, source, destination, sourceRevision, destinationAbsent]
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [move, copy] }
                    source: { type: string }
                    destination: { type: string }
                    sourceRevision: { type: string, pattern: '^r1\.' }
                    destinationAbsent: { type: boolean, enum: [true] }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: key 재사용 또는 진행 중인 claim; 진행 중이면 Retry-After 헤더 반환
          headers:
            Retry-After:
              description: 진행 중인 claim의 재시도 대기 시간(초). 그 외 409에는 생략.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: revision 불일치 또는 목적지 존재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 동기 삭제·복사 상한 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: 필수 조건 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/namespaces/{namespaceId}/fs/mkdir:
    post:
      operationId: mkdir
      summary: 디렉터리 생성
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MkdirRequest'
      responses:
        '200':
          description: 이미 존재하는 디렉터리(멱등 성공)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/touch:
    post:
      operationId: touch
      summary: 빈 파일 생성(이미 존재하면 내용은 바꾸지 않음)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchRequest'
      responses:
        '200':
          description: 이미 존재하는 파일(멱등 성공)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/mv:
    post:
      operationId: move
      summary: 파일/디렉터리 이동
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/cp:
    post:
      operationId: copy
      summary: 파일/디렉터리 복사(Blob-level Copy-on-Write, `apps/api/docs/adr/0003-file-copy-blob-level-cow.md`)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 복사 대상 Node 수가 namespace/전역 상한을 초과함(`VFS_COPY_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/rmdir:
    post:
      operationId: rmdir
      summary: 빈 디렉터리 삭제
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 삭제됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 디렉터리가 비어있지 않거나(`VFS_DIRECTORY_NOT_EMPTY`) root 대상 연산(`VFS_INVALID_OPERATION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/rm:
    post:
      operationId: rm
      summary: 파일/디렉터리 삭제
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: 디렉터리를 재귀적으로 삭제할지 여부. 기본 `false`(빈 디렉터리만 허용).
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: 삭제됨
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 삭제 대상 Node 수가 namespace/전역 상한을 초과함(`VFS_DELETE_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/content/conditional:
    post:
      operationId: putConditionalContent
      summary: 조건부 파일 콘텐츠 업로드(raw stream)
      tags: [fs]
      description: |
        이미 존재하는 부모 아래에 파일을 생성하거나 수정한다. UUID key와 scope를
        동일하게 재사용하면 저장 없이 raw body를 해시해 원래 결과를 30일간 재생한다.
        `X-If-Absent`와 `X-If-Revision`은 정확히 하나만 지정한다.
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mutation-Scope
          in: header
          required: true
          description: 호출자 scope. UTF-8 인코딩 기준 최대 128바이트.
          schema: { type: string, minLength: 1, x-maxUtf8Bytes: 128 }
        - name: X-If-Absent
          in: header
          required: false
          schema: { type: string, enum: ['true'] }
        - name: X-If-Revision
          in: header
          required: false
          schema: { type: string, pattern: '^r1\.' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionalMutationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: key 재사용 또는 진행 중인 claim; 진행 중이면 Retry-After 반환
          headers:
            Retry-After:
              description: 진행 중인 claim의 재시도 대기 시간(초). 그 외 409에는 생략.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '412':
          description: revision 불일치 또는 대상 존재
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 파일 크기 상한 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '428':
          description: 필수 조건 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/namespaces/{namespaceId}/fs/content:
    post:
      operationId: putContent
      summary: 파일 콘텐츠 업로드(raw stream만 지원, `apps/api/docs/adr/0004-raw-stream-upload-only.md`)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: parents
          in: query
          required: false
          description: 상위 디렉터리가 없으면 함께 생성할지 여부.
          schema:
            type: boolean
            default: false
        - name: force
          in: query
          required: false
          description: '`If-Match` 없이도 기존 콘텐츠를 덮어쓸지 여부.'
          schema:
            type: boolean
            default: false
        - name: If-Match
          in: header
          required: false
          description: |
            낙관적 동시성 제어용 `version`(`VfsNode.version`). 값이 있는데 현재
            version과 다르면 409(`VFS_VERSION_CONFLICT`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: |
          임의의 `Content-Type`을 그대로 저장했다가 다운로드 시 재현한다
          (`multipart/form-data`는 지원하지 않음).
      responses:
        '200':
          description: 기존 파일 갱신
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VfsNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리이거나(`VFS_IS_DIRECTORY`) `If-Match` version 불일치(`VFS_VERSION_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 파일 크기가 상한을 초과함(`VFS_FILE_TOO_LARGE`). 상한은 배포/namespace별 설정값.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getContent
      summary: 파일 콘텐츠 조회(Range 지원, 인라인)
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 전체 콘텐츠
          headers:
            Content-Type:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 부분 콘텐츠(`Range` 요청)
          headers:
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리임(`VFS_IS_DIRECTORY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: 처리할 수 없는 Range(`VFS_RANGE_NOT_SATISFIABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/download:
    get:
      operationId: download
      summary: '파일 콘텐츠 다운로드(Range 지원, `Content-Disposition: attachment`)'
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - name: path
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: 전체 콘텐츠
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: 부분 콘텐츠(`Range` 요청)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 대상이 디렉터리임(`VFS_IS_DIRECTORY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: 처리할 수 없는 Range(`VFS_RANGE_NOT_SATISFIABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/namespaces/{namespaceId}/fs/presigned-download:
    get:
      operationId: getPresignedDownloadUrl
      summary: Presigned 다운로드 URL 발급(`STORAGE-02`)
      description: '`ENCRYPTED` namespace는 지원하지 않는다(`VFS_PRESIGNED_ENCRYPTED_UNSUPPORTED`).'
      tags: [fs]
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
