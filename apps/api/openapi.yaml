openapi: 3.0.3
info:
  title: Storix API
  version: 1.0.0
  description: |
    Storix는 호출 서버가 사용하는 독립 VFS(Virtual File System) 저장 서버다. 파일의
    업무적 의미와 최종 사용자 인증·권한 판단은 호출 서버의 책임이며 Storix 도메인에
    포함하지 않는다. 용어 정의는 `apps/api/CONTEXT.md` 참고.

    이 스펙은 `namespace`/`fs` 컨트롤러만 다룬다. `/health/*`(인증 예외 대상)와
    `/metrics`(운영 관측용)는 외부 API 계약이 아니라서 포함하지 않는다.

    **파일·스냅샷 경로 계약.** 공개 경로 입력은 `/`로 시작하는 절대경로다. TREE snapshot
    content의 `path`만 상대경로이며 `.`은 TREE 루트다. 중복 `/`, `.` 구간, 끝 `/`는
    제거해 같은 정규 경로로 식별한다. `..`, 백슬래시, C0·C1·DEL 제어 문자,
    Unicode Bidi_Control, 고립 surrogate 및 NFC가 아닌 이름은 정규화하지 않고
    400 `VFS_INVALID_PATH`로 거부한다. 이름은 대소문자를 구별하며 각각 UTF-8
    최대 255바이트다. 정규 절대경로는 앞 `/`를 포함해 UTF-8 최대 4096바이트이고,
    TREE 상대경로도 앞에 `/`를 붙인 길이로 검사한다. 이동·복사로 만들어질 최종
    경로와 모든 하위 경로에도 같은 한도를 적용한다. 경로 오류로 실패하면 파일
    트리·본문·snapshot은 변경되지 않는다. 조건부 변경의 오류 receipt는 해당
    endpoint의 재생 계약을 따른다. 부모 디렉터리는 기본적으로 생성하지 않으며
    `parents` 또는 `destinationParents`가 있는 작업에서 명시적으로 `true`로
    지정할 때만 생성한다. `/`는 조회·목록·TREE snapshot 원본과 이동·복사의
    디렉터리 목적지로 사용할 수 있다. 루트 자체를 파일로 쓰거나 이동·삭제할 수는 없다.

    **파일과 FILE snapshot 흐름.** 예를 들어 `/notebook.ipynb`의 새 바이트를
    `POST /api/v2/namespaces/{namespaceId}/fs/content/conditional?path=/notebook.ipynb`에
    `X-If-Absent: true`와 UUID 형식 `Idempotency-Key`·비어 있지 않은
    `X-Mutation-Scope`(UTF-8 최대 128바이트)로 보낸다.
    201의 `resource.id`는 파일 ID이고 `resource.revision`은 이 상태의 불투명 토큰이다.
    `GET /fs/stat?path=/notebook.ipynb`에서 같은 ID·revision·`sha256`을 읽거나,
    인증된 전체 `GET /fs/content?path=/notebook.ipynb` 200의 세 `X-Storix-*` 헤더와
    받은 전체 바이트의 SHA-256을 비교할 수 있다. 교체할 때는 새 key와
    `X-If-Revision: <현재 revision>`으로 같은 조건부 콘텐츠 endpoint에 보낸다.
    FILE snapshot은 `POST /fs/snapshots`에 `{"kind":"file","path":"/notebook.ipynb",
    "sourceRevision":"<현재 revision>"}`과 새 key·scope로 생성한다. 결과의
    `rootNodeId`는 원본 파일 ID이고 `sha256`은 보존한 원본 바이트의 해시다.
    `GET /fs/snapshots/{snapshotId}`의 값과 `GET /fs/snapshots/{snapshotId}/content`의
    전체 바이트를 대조한 뒤, `POST /fs/snapshots/{snapshotId}/restore`에 대상 `path`와
    `ifAbsent: true` 또는 현재 대상의 `ifRevision` 중 하나를 보낼 수 있다.
    각 변경 요청에는 새 UUID key를 사용한다. Receipt identity는 namespace/scope/key이며,
    같은 identity의 다른 method·route·조건·본문은 409 `MUTATION_KEY_REUSED`다.
    `r1.` revision은 해석하거나 순서를 비교하지 않고 동등성 조건으로 사용한다.

    **호출 예시.** 아래 예시는 이미 프로비저닝된 namespace를 사용한다. Namespace를
    선택하고 최종 사용자·프로젝트 권한을 확인하는 것은 호출 서버 책임이다. 예시의
    `STORIX_API_KEY`, `NAMESPACE_ID`, `FILE_REVISION`, `SNAPSHOT_ID`는 실제 값으로
    바꾼다. 요청 본문은 노트북 JSON을 파싱하지 않고 파일 바이트 그대로 전송한다.

    먼저 적용 한도와 현재 사용량을 인증된 namespace 조회로 확인한다. 바이트 값은
    10진 문자열이며, `limits.maxFileSizeBytes`가 단일 파일의 실제 적용 상한이다.

    ```sh
    curl --fail-with-body -H "Authorization: Bearer $STORIX_API_KEY" \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID"
    ```

    새 파일은 `X-If-Absent: true`로 생성한다. 각 변경 요청마다 새로운 UUID
    `Idempotency-Key`와 호출자가 정하는 비어 있지 않은 `X-Mutation-Scope`
    (UTF-8 최대 128바이트)를 보낸다. 동일 namespace/scope/key는 method, route, 조건,
    본문 fingerprint로 구분되므로 입력을 바꾸거나 다른 작업을 요청할 때 새 key를 쓴다.
    성공 응답의 `resource.id`는 파일 ID, `resource.revision`은 새 상태의 불투명 토큰이다.

    ```sh
    curl --fail-with-body -X POST \
      -H "Authorization: Bearer $STORIX_API_KEY" \
      -H "Idempotency-Key: 00000000-0000-4000-8000-000000000001" \
      -H "X-Mutation-Scope: notebook-service" \
      -H "X-If-Absent: true" -H "Content-Type: application/octet-stream" \
      --data-binary @notebook.ipynb \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/content/conditional?path=%2Fnotebook.ipynb"
    ```

    상태 metadata의 `revision`은 조건부 변경에 쓰고, FILE `sha256`은 저장된 전체
    원본 바이트의 SHA-256이다. 전체 `GET /fs/content` 200은 `X-Storix-File-Id`,
    `X-Storix-Revision`, `X-Storix-Sha256`을 반환한다. 마지막 헤더와 받은 바이트의
    SHA-256을 비교해 전송 완전성을 확인한다. Range 응답에는 전체 파일 해시 검증을 적용하지 않는다.

    ```sh
    curl --fail-with-body -H "Authorization: Bearer $STORIX_API_KEY" \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/stat?path=%2Fnotebook.ipynb"
    curl --fail-with-body -D notebook.headers -o notebook.download \
      -H "Authorization: Bearer $STORIX_API_KEY" \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/content?path=%2Fnotebook.ipynb"
    grep -i '^X-Storix-Sha256:' notebook.headers
    sha256sum notebook.download
    ```

    교체는 최신 `FILE_REVISION`을 `X-If-Revision`에 넣고 새 멱등성 키를 사용한다.
    이 조건이 어긋나면 412 `VFS_PRECONDITION_FAILED`이며 `current`는 충돌 시점 metadata다.

    ```sh
    curl --fail-with-body -X POST \
      -H "Authorization: Bearer $STORIX_API_KEY" \
      -H "Idempotency-Key: 00000000-0000-4000-8000-000000000002" \
      -H "X-Mutation-Scope: notebook-service" \
      -H "X-If-Revision: $FILE_REVISION" -H "Content-Type: application/octet-stream" \
      --data-binary @notebook.ipynb \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/content/conditional?path=%2Fnotebook.ipynb"
    ```

    FILE snapshot은 캡처하려는 현재 revision을 `sourceRevision`으로 고정한다. 응답의
    `snapshotId`, `rootNodeId`, `sha256`을 보존한다. 복원은 현재 대상 revision을 다시
    조회한 뒤 새 key와 `ifRevision`을 보내며, 새 경로 생성이라면 `ifAbsent: true`를 쓴다.

    ```sh
    curl --fail-with-body -X POST \
      -H "Authorization: Bearer $STORIX_API_KEY" \
      -H "Idempotency-Key: 00000000-0000-4000-8000-000000000003" \
      -H "X-Mutation-Scope: notebook-service" -H "Content-Type: application/json" \
      --data '{"kind":"file","path":"/notebook.ipynb","sourceRevision":"'"$FILE_REVISION"'"}' \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/snapshots"
    curl --fail-with-body -H "Authorization: Bearer $STORIX_API_KEY" \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/snapshots/$SNAPSHOT_ID"
    curl --fail-with-body -o snapshot.ipynb -H "Authorization: Bearer $STORIX_API_KEY" \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/snapshots/$SNAPSHOT_ID/content"
    ```

    snapshot metadata의 `sha256`과 `snapshot.ipynb`의 SHA-256을 대조한다. 실제 복원은
    snapshot 이후 파일이 바뀐 상태를 대상으로 한다. 먼저 현재 revision을 조건으로 다른
    바이트를 저장하고, 그 응답의 새 revision을 `FILE_REVISION`에 넣는다.

    ```sh
    curl --fail-with-body -X POST \
      -H "Authorization: Bearer $STORIX_API_KEY" \
      -H "Idempotency-Key: 00000000-0000-4000-8000-000000000004" \
      -H "X-Mutation-Scope: notebook-service" \
      -H "X-If-Revision: $FILE_REVISION" -H "Content-Type: application/octet-stream" \
      --data-binary @edited-notebook.ipynb \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/content/conditional?path=%2Fnotebook.ipynb"
    ```

    그 다음 snapshot을 현재의 revision 조건으로 복원한다. 생성 복원은 `ifAbsent: true`를
    사용하고, 아래처럼 기존 파일을 덮을 때는 최신 `FILE_REVISION`을 사용한다.

    ```sh
    curl --fail-with-body -X POST \
      -H "Authorization: Bearer $STORIX_API_KEY" \
      -H "Idempotency-Key: 00000000-0000-4000-8000-000000000005" \
      -H "X-Mutation-Scope: notebook-service" -H "Content-Type: application/json" \
      --data '{"path":"/notebook.ipynb","ifRevision":"'"$FILE_REVISION"'"}' \
      "https://storix.example/api/v2/namespaces/$NAMESPACE_ID/fs/snapshots/$SNAPSHOT_ID/restore"
    ```

    `FILE_REVISION`은 각 변경 이후 새 metadata에서 갱신한다. 완료된 조건부 변경과
    snapshot 변경의 응답은 namespace/scope/key로 구분하며 완료 시점부터 30일간 재생한다.
    30일이 지나면 같은 key의 재생은 보장되지 않고 새 작업으로 평가될 수 있다. 만료
    receipt의 물리 정리는 GC 시점에 따르며, 호출자는 보존 기한을 넘겨 key를 재사용하지
    않는다. 요청 조건·성공 필드·오류 코드는 아래 각 operation 계약을 기준으로 한다.

    SQLite는 단일 서버 인스턴스 배포 전제다. 여러 서버 인스턴스는 공유
    PostgreSQL과 Blob 저장소를 사용한다. SQLite는 모든 쿼리를 한 줄로 직렬화하며,
    앞선 트랜잭션이 30초를 넘게 끝나지 않으면 대기 중인 요청은 503 `DB_BUSY`와
    `Retry-After: 1`로 실패한다(같은 key로 재시도 가능, receipt로 저장하지 않음). PostgreSQL에서는 나오지 않는다.

    **RQ-018 오류·재시도 계약.** 조건부 mutation과 snapshot endpoint의 5xx는 receipt로 저장하지 않는다.
    따라서 같은 요청·같은 key를 재전송하면 기존 완료 receipt가 있을 때는 그 결과를 재생하고, 없으면 요청을 다시
    평가한다. 아래 표의 “같은 key”는 상태와 입력을 바꾸지 않은 동일 요청을 뜻한다. 조건부 mutation/snapshot API에서
    receipt에 저장된 결정적 4xx가 재생된 뒤 상태나 입력을 고친 경우 새 key를 사용한다. 그 밖의 예외는 표의 endpoint
    규칙을 따른다. `Retry-After` 헤더가 있으면 그 초 수만큼 기다린다. 헤더가 없으면 서버가 정한 대기 시간을
    가정하지 않는다.

    | code | HTTP | 같은 key 재시도 | 상태/입력을 고친 뒤 | Retry-After |
    | --- | ---: | --- | --- | --- |
    | `UNAUTHORIZED` | 401 | 인증을 갱신한 뒤 가능; receipt 없음 | 인증 문제를 고친 뒤 같은 key 가능 | 없음 |
    | `NAMESPACE_NOT_FOUND`, `VFS_NODE_NOT_FOUND`, `VFS_SNAPSHOT_NOT_FOUND` | 404 | 같은 상태에서는 재평가; 조건부 receipt가 있으면 최초 결과 재생 | 새 key | 없음 |
    | `VFS_INVALID_PATH`, `VFS_INVALID_MUTATION_REQUEST`, `VFS_INVALID_REVISION`, `VFS_INVALID_CURSOR`, `IDEMPOTENCY_KEY_REQUIRED`, `NAMESPACE_INVALID_NAME`, `NAMESPACE_INVALID_ENCRYPTION_POLICY`, `NAMESPACE_INVALID_ACCESS_POLICY`, `NAMESPACE_PUBLIC_ENCRYPTION_CONFLICT`, `NAMESPACE_INVALID_TOTAL_LOGICAL_BYTES`, `NAMESPACE_QUOTA_LIMIT_EXCEEDS_GLOBAL`, `NAMESPACE_ENCRYPTION_NOT_CONFIGURED` | 400 | 조건부 receipt가 저장한 요청이면 최초 오류 재생; 그 외 재평가 | 새 key | 없음 |
    | `VFS_NOT_DIRECTORY`, `VFS_IS_DIRECTORY`, `VFS_ALREADY_EXISTS`, `VFS_VERSION_CONFLICT`, `VFS_INVALID_OPERATION`, `VFS_DIRECTORY_NOT_EMPTY`, `VFS_REVISION_EXHAUSTED`, `VFS_PRESIGNED_ENCRYPTED_UNSUPPORTED`, `VFS_FEATURE_DISABLED` | 409 | 조건부 receipt가 저장한 요청이면 최초 오류 재생; 그 외 재평가 | 새 key | 없음 |
    | `NAMESPACE_ALREADY_EXISTS` | 409 | namespace idempotency receipt가 저장한 409를 같은 key에서 반환 | name/body를 고치려면 새 key | 없음 |
    | `MUTATION_IN_PROGRESS` | 409 | 같은 key로 재시도 | 해당 없음 | 있으면 대기 |
    | `MUTATION_KEY_REUSED` | 409 | 기존 mutation receipt와 fingerprint가 다름; 기존 receipt를 변경하지 않음 | 새 key | 없음 |
    | `IDEMPOTENCY_KEY_REUSED` | 422 | namespace idempotency key에 다른 본문이 저장되어 있음 | 새 key | 없음 |
    | `VFS_PRECONDITION_FAILED` | 412 | 저장된 최초 충돌 응답 재생 | 최신 revision/조건으로 새 key | 없음 |
    | `VFS_FILE_TOO_LARGE`, `VFS_DELETE_LIMIT_EXCEEDED`, `VFS_COPY_LIMIT_EXCEEDED`, `VFS_SNAPSHOT_LIMIT_EXCEEDED`, `VFS_QUOTA_EXCEEDED` | 413 | 조건부 receipt가 저장한 오류는 재생; 업로드 크기 초과는 재평가 | 상한/입력을 고친 뒤 새 key | 없음 |
    | `VFS_PRECONDITION_REQUIRED` | 428 | 저장된 조건부 오류는 재생 | 조건을 추가한 뒤 새 key | 없음 |
    | `VFS_INVALID_RANGE`, `VFS_RANGE_NOT_SATISFIABLE` | 416 | 조회를 다시 평가 | range 입력을 고친 뒤 조회 재시도 | 없음 |
    | `DB_BUSY` | 503 | 같은 key로 재시도; receipt 없음 | 해당 없음 | 통상 `1` |
    | `STORAGE_UNAVAILABLE` | 503 | 같은 key로 재시도; 완료 receipt가 있으면 재생 | 해당 없음 | 있을 때만 준수 |
    | `STORAGE_FAILURE` | 500 | 자동 재시도하지 말고 원인 조사; 결과 불명확 시 안전성 확인 후 같은 key로 평가 | 원인을 해결한 뒤 판단 | 없음 |
    | `INTERNAL_ERROR` | 500 | 자동 재시도하지 말고 원인 조사; 결과 불명확 시 안전성 확인 후 같은 key로 평가 | 원인을 해결한 뒤 판단 | 없음 |

    **변경 요청 헤더 오류.** `content/conditional`, `mutations`, `snapshots`(생성·복원·삭제), `upload-sessions` 생성,
    휴지통 `restore`는 `Idempotency-Key`(UUID 형식)와 `X-Mutation-Scope`(비어 있지 않고 UTF-8 128바이트 이하) 중 하나라도
    없거나 형식이 틀리면 400 `VFS_INVALID_MUTATION_REQUEST`다. 이 요청은 receipt를 남기지 않으므로 헤더를 고쳐 같은
    key로 다시 보낼 수 있다. `IDEMPOTENCY_KEY_REQUIRED`는 이 endpoint들이 아니라 namespace 생성과 관리자 PATCH가
    key를 보내지 않았을 때의 코드이며, namespace 생성은 key 형식을 검증하지 않는다.

    `VFS_FEATURE_DISABLED`의 메시지에는 비활성 capability ID가 포함된다. 현재 등록된 선택 capability는 기본 비활성 `resumable-upload`, `change-feed`이며, 활성 상태는 `GET /api/v2/namespaces/{id}/capabilities`로 조회한다.

    5xx body의 `message`는 고정된 안전 문구이며 내부 예외 메시지, 저장소 주소, 파일 바이트, 키·자격 증명을 포함하지
    않는다. 미분류 예외는 `INTERNAL_ERROR`다. 다운로드 객체를 열기 전 실패는 표의 JSON 오류다. 응답 헤더/바이트 전송
    시작 뒤 스트림 실패는 상태와 body를 바꿀 수 없으므로 연결이 끊긴다. 전체 FILE 응답은 수신 바이트 수를
    `Content-Length`와, 전체 SHA-256을 `X-Storix-Sha256`과 비교해 완전성을 판정한다. Range 응답은 전체 해시 비교를
    약속하지 않는다.
  license:
    name: UNLICENSED
paths:
  /api/v2/namespaces:
    post:
      operationId: createNamespace
      summary: Namespace 생성
      description: |
        `Idempotency-Key` 헤더가 필수다. 같은 키와 같은 요청 본문의 재시도 또는
        동시 요청은 하나의 생성 결과로 수렴하며 최초 201 응답을 재생한다. 같은 키에
        다른 본문을 보내면 422를 반환한다. `maxTotalLogicalBytes`는 선택적 namespace 상한이며
        생략하면 전역 상한을 사용한다. 바이트 값은 10진수 문자열이다.
      parameters:
