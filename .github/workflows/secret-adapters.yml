name: 시크릿 어댑터

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  unit:
    name: 어댑터 단위 테스트 (${{ matrix.adapter }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        adapter: [bao, aws]
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
      - name: Node 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: 의존성 설치
        if: matrix.adapter == 'aws'
        working-directory: packages/secret-source-aws
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: 단위 테스트
        working-directory: packages/secret-source-${{ matrix.adapter }}
        run: node --test
      - name: 타입 검사
        if: matrix.adapter == 'aws'
        working-directory: packages/secret-source-aws
        run: pnpm typecheck

  # 기준 이미지 변경도 변형에 영향을 주므로 경로 필터를 두지 않는다.
  image-smoke:
    name: 변형 이미지 스모크 (${{ matrix.adapter }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        adapter: [bao, aws]
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
      - name: 기준 이미지 빌드
        run: docker build -t storix-api:adapters-base -f apps/api/Dockerfile .
      - name: 변형 이미지 빌드
        run: |
          docker build \
            --file packages/secret-source-${{ matrix.adapter }}/Dockerfile \
            --build-arg STORIX_BASE_IMAGE=storix-api:adapters-base \
            --tag storix-api:adapters-${{ matrix.adapter }} \
            .
      - name: 어댑터 로드와 X_REF 해석 확인
        run: bash .github/scripts/adapter-image-smoke.sh storix-api:adapters-${{ matrix.adapter }} ${{ matrix.adapter }}
