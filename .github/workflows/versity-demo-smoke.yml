name: VersityGW 데모 스모크 테스트

on:
  push:
    branches: [dev]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.versitygw.yml'
      - 'docker-compose.postgres.yml'
      - '.github/compose.ci.yml'
      - '.env.example'
      - 'apps/api/**'
      - '.github/workflows/versity-demo-smoke.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.versitygw.yml'
      - 'docker-compose.postgres.yml'
      - '.github/compose.ci.yml'
      - '.env.example'
      - 'apps/api/**'
      - '.github/workflows/versity-demo-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # base + VersityGW 백엔드 + 러너 로컬 Postgres + CI 전용 포트 노출.
  # 첫 -f 파일의 디렉터리(루트)가 project directory가 되므로 .github/ 아래
  # 파일을 섞어도 상대 경로는 루트 기준으로 해석된다.
  COMPOSE_FILES: >-
    -f docker-compose.yml
    -f docker-compose.versitygw.yml
    -f docker-compose.postgres.yml
    -f .github/compose.ci.yml

jobs:
  smoke:
    name: VersityGW 백엔드 업로드/다운로드 라운드트립
    runs-on: ubuntu-24.04
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: .env 생성
        run: |
          cp .env.example .env
          STORIX_API_KEY=$(openssl rand -hex 32)
          sed -i "s|^STORIX_API_KEY=.*|STORIX_API_KEY=${STORIX_API_KEY}|" .env
          sed -i "s|^STORIX_STORAGE_PUBLIC_ENDPOINT=.*|STORIX_STORAGE_PUBLIC_ENDPOINT=localhost|" .env
          sed -i "s|^STORIX_STORAGE_PUBLIC_PORT=.*|STORIX_STORAGE_PUBLIC_PORT=7070|" .env
          # STORIX_STORAGE_REGION이 비어 있으면 presigned 발급 시 minio-js가 리전 자동
          # 조회를 STORIX_STORAGE_PUBLIC_ENDPOINT(localhost = app 컨테이너 자신)로
          # 보내다 실패해 500난다(docs/deployment/nginx-reverse-proxy.md와 동일).
          sed -i "s|^STORIX_STORAGE_REGION=.*|STORIX_STORAGE_REGION=us-east-1|" .env
          echo "STORIX_API_KEY=${STORIX_API_KEY}" >> "$GITHUB_ENV"

      - name: VersityGW 백엔드 스택 기동
        run: docker compose ${{ env.COMPOSE_FILES }} up -d --build

      - name: app 헬스체크 대기 (/health/ready)
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/health/ready > /dev/null; then
              echo "app ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app이 /health/ready에 응답하지 않음 (60초 타임아웃)" >&2
          exit 1

      - name: 업로드/다운로드/presigned-download 라운드트립
        run: |
          set -euo pipefail

          payload="versity-demo smoke $(date -u +%FT%TZ)"
          auth_header="Authorization: Bearer ${STORIX_API_KEY}"

          namespace_response=$(curl -sf -X POST http://localhost:3000/api/v1/namespaces \
            -H "$auth_header" \
            -H "Idempotency-Key: versity-smoke-$(date +%s)" \
            -H 'Content-Type: application/json' \
            -d '{"name":"versity-smoke","encryptionPolicy":"NONE"}')
          namespace_id=$(echo "$namespace_response" | jq -r '.id')
          echo "namespace: $namespace_id"

          curl -sf -X PUT "http://localhost:3000/api/v1/namespaces/${namespace_id}/fs/content?path=smoke.txt&parents=true" \
            -H "$auth_header" \
            -H 'Content-Type: text/plain' \
            --data-binary "$payload" > /dev/null

          downloaded=$(curl -sf "http://localhost:3000/api/v1/namespaces/${namespace_id}/fs/content?path=smoke.txt" \
            -H "$auth_header")
          if [ "$downloaded" != "$payload" ]; then
            echo "::error::API content 다운로드 결과 불일치: 기대='$payload' 실제='$downloaded'" >&2
            exit 1
          fi

          presigned_response=$(curl -sf "http://localhost:3000/api/v1/namespaces/${namespace_id}/fs/presigned-download?path=smoke.txt" \
            -H "$auth_header")
          presigned_url=$(echo "$presigned_response" | jq -r '.url')
          echo "presigned url: $presigned_url"

          presigned_content=$(curl -sf "$presigned_url")
          if [ "$presigned_content" != "$payload" ]; then
            echo "::error::presigned URL 다운로드 결과 불일치: 기대='$payload' 실제='$presigned_content'" >&2
            exit 1
          fi

          echo "VersityGW 백엔드 업로드/다운로드/presigned-download 라운드트립 성공"

      - name: 컨테이너 로그 출력 (실패 시 진단용)
        if: always()
        run: docker compose ${{ env.COMPOSE_FILES }} logs

      - name: 컨테이너 정리
        if: always()
        run: docker compose ${{ env.COMPOSE_FILES }} down -v
