name: 릴리즈

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/cp949/storix

jobs:
  release:
    name: 릴리즈 노트 생성 + 이미지 배포
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.guard.outputs.commit }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 태그가 main의 조상인지 확인
        id: guard
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-parse "${{ github.ref_name }}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::태그(${{ github.ref_name }})가 origin/main의 조상이 아닙니다 — 릴리즈 중단"
            exit 1
          fi
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Node 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: 의존성 설치
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: CHANGELOG 추출 스크립트 유닛 테스트
        run: node --test '.github/scripts/**/*.test.mjs'

      - name: apps/api typecheck
        run: pnpm --filter @cp949/storix-api typecheck

      - name: apps/api lint
        run: pnpm --filter @cp949/storix-api lint

      - name: apps/api 단위 테스트
        run: pnpm --filter @cp949/storix-api test

      - name: 버전 계산
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG 섹션 추출
        run: node .github/scripts/extract-changelog-section.mjs "${{ steps.version.outputs.version }}" CHANGELOG.md release-notes.md

      - name: 이미지 참조 안내 추가
        run: |
          {
            echo ""
            echo "## 이미지"
            echo ""
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}"
            echo '```'
            echo ""
            echo "이 이미지의 \`backup\`·\`restore\`는 Postgres 17 client를 쓴다."
            echo ""
            echo "## 시크릿 어댑터 변형 이미지"
            echo ""
            echo "외부 시크릿 저장소를 \`X_REF\`로 읽으려면 어댑터가 들어 있는 변형 이미지를 쓴다. 기준 이미지에는 어댑터가 없다."
            echo ""
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}-bao"
            echo "docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}-aws"
            echo '```'
            echo ""
            echo "변형은 기준 이미지 push 뒤 별도 job으로 발행한다. 변형 job이 실패해도 기준 이미지와 이 Release는 유지된다."
            echo "- [OpenBao 어댑터](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/guides/openbao-secret-source.md)"
            echo "- [AWS Secrets Manager 어댑터](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/guides/aws-secrets-manager-secret-source.md)"
            echo ""
            echo "## 업그레이드와 롤백"
            echo ""
            echo "- 스키마 마이그레이션은 자동으로 되돌리지 않는다(\`migration:revert\` 없음)."
            echo "- 마이그레이션이 스키마를 바꾼 뒤 이전 버전으로 돌아가려면 업그레이드 전에 만든 백업을 복원한다."
            echo "- 업그레이드 전에 백업하지 않았다면 스키마 변경 이후에는 롤백할 수 없다."
            echo "- 절차: [docs/deployment/upgrade.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/deployment/upgrade.md)"
          } >> release-notes.md

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.guard.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes-file release-notes.md

  # 어댑터 변형 이미지. 기준 이미지 push 뒤에 실행하고, 방금 push한 기준 이미지 위에 어댑터를 얹는다.
  # 실패해도 기준 이미지와 Release는 이미 발행된 상태다. Actions의 "Re-run failed jobs"로 이 job만 다시 돌린다.
  variants:
    name: 어댑터 변형 이미지 (${{ matrix.adapter }})
    needs: release
    runs-on: ubuntu-24.04
    # 변형은 저장소에 쓰지 않는다. GHCR push 권한만 필요하다.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        adapter: [bao, aws]
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node 설정
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: 어댑터 단위 테스트
        working-directory: packages/secret-source-${{ matrix.adapter }}
        run: |
          if [ "${{ matrix.adapter }}" = "aws" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          fi
          node --test

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 변형 이미지 빌드
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          docker build \
            --file packages/secret-source-${{ matrix.adapter }}/Dockerfile \
            --build-arg "STORIX_BASE_IMAGE=${IMAGE}:${TAG}" \
            --label "org.opencontainers.image.revision=${{ needs.release.outputs.commit }}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.created=${{ needs.release.outputs.created }}" \
            --tag "${IMAGE}:${TAG}-${{ matrix.adapter }}" \
            .

      - name: 변형 이미지 스모크
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: bash .github/scripts/adapter-image-smoke.sh "${IMAGE}:${TAG}-${{ matrix.adapter }}" "${{ matrix.adapter }}"

      - name: 변형 이미지 push
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: docker push "${IMAGE}:${TAG}-${{ matrix.adapter }}"
