# 여러 Storix WAS(API 서버) 호스트가 하나의 전용 Postgres 호스트를 공유할
# 때 쓰는 override — docker-compose.yml과 함께 -f로 넘긴다. base 파일의
# 로컬 postgres 컨테이너는 편의용으로 계속 같이 뜨지만, 이 override를
# 쓰면 미사용 상태로 남는다(정리는 스코프 밖 — 기존
# docker-compose.versity-demo.yml/docker-compose.s3-demo.yml과 같은 선례).
# (ADR-0003, docs/deployment/multi-instance-versitygw.md 참고)
#
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.versity-demo.yml -f docker-compose.shared-db.yml up
#
# DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME은 여기서 override하지 않는다.
# DB_PORT는 표준 포트(5432, base 기본값 그대로)만 지원한다 — 비표준
# 포트가 필요해지면 그때 추가한다. 나머지 셋은 base 파일에서 이미 .env
# 값을 그대로 쓰므로, 공유 DB의 실제 자격증명은 .env의 기존
# DB_USERNAME/DB_PASSWORD/DB_NAME에 넣으면 된다.
services:
  migrate:
    environment:
      DB_HOST: ${SHARED_DB_HOST:?SHARED_DB_HOST must be set}

  gc:
    environment:
      DB_HOST: ${SHARED_DB_HOST:?SHARED_DB_HOST must be set}

  backup:
    environment:
      DB_HOST: ${SHARED_DB_HOST:?SHARED_DB_HOST must be set}

  restore:
    environment:
      DB_HOST: ${SHARED_DB_HOST:?SHARED_DB_HOST must be set}

  app:
    environment:
      DB_HOST: ${SHARED_DB_HOST:?SHARED_DB_HOST must be set}
