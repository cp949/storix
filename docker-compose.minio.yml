# MinIO 백엔드 override — base docker-compose.yml과 함께 -f로 겹쳐 쓴다:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
#
# 이 파일이 하는 일:
#   - minio 컨테이너와 버킷 초기화(minio-init)를 추가한다.
#   - app/gc/backup/restore의 STORAGE_ENDPOINT/STORAGE_PORT/STORAGE_USE_SSL을
#     minio:9000(HTTP)으로 재정의한다 — 이 조합에서 .env의 그 세 값은 무시된다.
#     STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY/STORAGE_BUCKET은 그대로 쓰이며,
#     MinIO root 자격증명과 초기 버킷 이름으로도 사용된다.
#   - nginx-demo profile: "공개 도메인(443/TLS) → nginx → 내부 MinIO(9000)"
#     reverse-proxy 참조 샘플(STORAGE-03, docs/deployment/nginx-reverse-proxy.md).
#     docs/deployment/nginx-reverse-proxy.conf가 minio:9000으로 proxy_pass하는
#     MinIO 전용 구성이라 이 파일에 둔다.
#       docker compose -f docker-compose.yml -f docker-compose.minio.yml \
#         -f docker-compose.postgres.yml --profile nginx-demo up -d --wait
#
# 이미 운영 중인 MinIO에 붙일 때는 이 파일을 쓰지 않는다 — base 단독으로
# 기동하고 .env의 STORAGE_*에 그 서버의 접속 정보를 넣는다.

x-minio-env: &minio-env
  STORAGE_ENDPOINT: minio
  STORAGE_PORT: '9000'
  STORAGE_USE_SSL: 'false'

x-minio-deps: &minio-deps
  minio:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  app:
    environment: *minio-env
    depends_on: *minio-deps

  gc:
    environment: *minio-env
    depends_on: *minio-deps

  backup:
    environment: *minio-env
    depends_on: *minio-deps

  restore:
    environment: *minio-env
    depends_on: *minio-deps

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-storix}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-storix-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-storix} ${STORAGE_SECRET_KEY:-storix-secret} &&
        mc mb --ignore-existing local/${STORAGE_BUCKET:-storix}
    depends_on:
      minio:
        condition: service_healthy

  nginx-cert-init:
    image: alpine:3.21
    profiles: ['nginx-demo']
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -newkey rsa:2048 \
          -keyout /certs/nginx.key -out /certs/nginx.crt \
          -days 3650 \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    volumes:
      - nginx-certs:/certs

  nginx:
    image: nginx:1.27-alpine
    profiles: ['nginx-demo']
    ports:
      - '${NGINX_PUBLIC_PORT:-8443}:443'
    volumes:
      - nginx-certs:/etc/nginx/certs:ro
      - ./docs/deployment/nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nginx-cert-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  minio-data:
  nginx-certs:
