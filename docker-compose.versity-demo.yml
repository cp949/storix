# ADR-0012/로드맵 STORAGE-01 검증용 override — MinIO 대신 VersityGW를
# 백엔드로 붙여도 STORAGE_* 값만 바뀔 뿐 api 코드는 그대로 동작함을 보여준다.
#
# 사용법 (base 파일과 함께 -f로 넘긴다 — .env는 그대로 두고 이 파일만으로
# app/gc/backup/restore의 STORAGE_ENDPOINT/STORAGE_PORT를 재정의한다):
#   docker compose -f docker-compose.yml -f docker-compose.versity-demo.yml up
#
# minio 서비스는 base 파일에 profile 없이 정의돼 있어 이 override와 함께
# 켜도 같이 기동한다(미사용 상태) — 백엔드 스왑이 실제로 동작함을 보여주는
# 목적에 집중하고, 정리는 스코프 밖으로 둔다.
#
# VERSITYGW_DATA_PATH를 .env에 설정하면(예: /mnt/nas/storix-data)
# versitygw 서비스의 볼륨이 named volume 대신 그 경로로 bind mount된다.
# 이 경로는 모든 WAS 호스트에서 동일한 값이어야 한다 — 공유되는 건
# NAS 데이터 자체이고, WAS별로 다른 건 그 경로를 바라보는 VersityGW
# 게이트웨이 컨테이너뿐이다(ADR-0003). 비워두면 지금과 동일하게
# named volume을 쓴다.

services:
  app:
    environment:
      STORAGE_ENDPOINT: versitygw
      STORAGE_PORT: 7070
    depends_on:
      versitygw:
        condition: service_healthy
      versitygw-init:
        condition: service_completed_successfully

  gc:
    environment:
      STORAGE_ENDPOINT: versitygw
      STORAGE_PORT: 7070
    depends_on:
      versitygw:
        condition: service_healthy
      versitygw-init:
        condition: service_completed_successfully

  backup:
    environment:
      STORAGE_ENDPOINT: versitygw
      STORAGE_PORT: 7070
    depends_on:
      versitygw:
        condition: service_healthy
      versitygw-init:
        condition: service_completed_successfully

  restore:
    environment:
      STORAGE_ENDPOINT: versitygw
      STORAGE_PORT: 7070
    depends_on:
      versitygw:
        condition: service_healthy
      versitygw-init:
        condition: service_completed_successfully

  versitygw:
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-storix}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:-storix-secret}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data
      # --health는 backend 서브커맨드보다 앞에 와야 하는 global flag라 VGW_ARGS로 전달한다.
      VGW_ARGS: '--health /health'
    volumes:
      - ${VERSITYGW_DATA_PATH:-versitygw-data}:/data
    healthcheck:
      # alpine 베이스 이미지라 curl이 없다 — busybox wget 사용.
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:7070/health']
      interval: 5s
      timeout: 5s
      retries: 10

  versitygw-init:
    image: minio/mc:latest
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://versitygw:7070 ${STORAGE_ACCESS_KEY:-storix} ${STORAGE_SECRET_KEY:-storix-secret} &&
        mc mb --ignore-existing local/${STORAGE_BUCKET:-storix}
    depends_on:
      versitygw:
        condition: service_healthy

volumes:
  versitygw-data:
