# STORAGE-03 참조 샘플: 공개 도메인(443/TLS) → nginx → 내부 MinIO(9000/HTTP).
# 로컬 재현/통합 테스트는 이 파일을 그대로 쓴다. 운영 배포로 옮길 때 바꿔야 하는
# 값은 docs/deployment/nginx-reverse-proxy.md 참고.

# presigned URL의 쿼리스트링(X-Amz-Signature 등)은 TTL 동안 유효한 자격증명이다
# (ADR-0013) — 기본 combined 로그 포맷은 전체 요청 라인(쿼리스트링 포함)을
# 남기므로, 쿼리스트링을 뺀 포맷을 쓴다.
log_format presigned_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    access_log /var/log/nginx/access.log presigned_safe;

    location / {
        # presigned URL은 GET 전용이다. MinIO의 S3 API 표면(PUT/DELETE 등)을
        # 공개 도메인에 불필요하게 열어두지 않도록 그 외 메서드는 차단한다.
        limit_except GET {
            deny all;
        }

        # $host는 포트를 제거한다. presigned 서명은 클라이언트가 실제로 보낸
        # Host 헤더(비표준 포트 포함) 그대로와 일치해야 하므로 $http_host를 쓴다.
        proxy_set_header Host $http_host;
        proxy_pass http://minio:9000;
    }
}
