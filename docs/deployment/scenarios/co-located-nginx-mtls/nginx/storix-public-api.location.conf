# 기존 sample.com 공개 server block 안에서 include한다. Storix API 중 이 prefix만
# 공개 listener에 노출한다. 나머지 /api/v1/은 내부 mTLS listener에만 둔다.
location ^~ /api/v1/public/ {
    limit_except GET {
        deny all;
    }

    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:3000;
}
