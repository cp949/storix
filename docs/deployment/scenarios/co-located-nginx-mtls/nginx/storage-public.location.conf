# 기존 sample.com 공개 server block 안에서 include한다. /storage/는 이
# 시나리오가 사용하는 실제 path-style S3 bucket 경로이므로 제거하지 않는다.
location ^~ /storage/ {
    limit_except GET {
        deny all;
    }

    access_log /var/log/nginx/storix-presigned-access.log storix_presigned_safe;
    proxy_buffering off;

    # SigV4가 서명한 Host, URI, query string을 그대로 VersityGW에 전달한다.
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:7070;
}
