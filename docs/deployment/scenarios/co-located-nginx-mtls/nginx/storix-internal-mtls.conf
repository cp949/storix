# 기존 host Nginx에 추가하는 WAS 전용 listener다. 외부 L7 LB를 경유하지 않는다.
server {
    listen 9443 ssl;
    server_name storix.internal;

    ssl_certificate     /etc/nginx/storix-mtls/server.crt;
    ssl_certificate_key /etc/nginx/storix-mtls/server.key;

    ssl_client_certificate /etc/nginx/storix-mtls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Storix가 실제 chunk byte 상한을 검사한다. Nginx의 기본 1 MiB 제한과
    # request/response buffering이 대용량 스트리밍을 가로막지 않게 한다.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Authorization은 기본 동작으로 그대로 전달한다. Nginx가 Storix API
        # key를 생성하거나 주입하지 않는다.
        proxy_pass http://127.0.0.1:3000;
    }
}
