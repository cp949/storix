# Storix all-in-one 데모 override — base + versitygw + postgres 뒤에 4번째
# -f로 겹쳐 쓴다. demo-was와 nginx 두 서비스만 추가한다.
#
#   docker compose \
#     --env-file docs/deployment/scenarios/demo-all-in-one/env/development.env.example \
#     -f docker-compose.yml \
#     -f docker-compose.versitygw.yml \
#     -f docker-compose.postgres.yml \
#     -f docs/deployment/scenarios/demo-all-in-one/compose.demo.yml \
#     up --build --wait
#
# 참고: _works/demo-proposals.md(제안서, git 미추적) 섹션 5/6/12.
services:
  demo-was:
    build:
      context: .
      dockerfile: apps/demo1/was/Dockerfile
    environment:
      DEMO_WAS_PORT: "4000"
      DEMO_WAS_STORIX_BASE_URL: http://app:3000
      DEMO_WAS_STORIX_API_KEY: "${STORIX_API_KEY:?STORIX_API_KEY must be set}"
      DEMO_WAS_PUBLIC_URL_BASE: "http://localhost:${STORIX_SCENARIO_NGINX_PORT:-8080}"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: docs/deployment/scenarios/demo-all-in-one/nginx/Dockerfile
    ports:
      - "${STORIX_SCENARIO_NGINX_PORT:-8080}:80"
    depends_on:
      demo-was:
        condition: service_healthy
      versitygw:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
