# Storix all-in-one 데모의 단일 공개 origin. 4개 location만 외부에 노출한다:
#   /                     React 정적 파일(SPA)
#   /demo-api/            Demo WAS reverse proxy
#   /storix-demo/         서명된 GET만 VersityGW로 전달(path-style bucket, STORIX_STORAGE_BUCKET과 이름이 같아야 한다)
#   /api/v1/public/       무인증 GET만 Storix로 전달(accessPolicy=PUBLIC)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    proxy_buffering off;

    # 앱의 업로드 크기 상한(STORIX_MAX_FILE_SIZE_BYTES=40MiB)보다 넉넉하게 설정.
    # Nginx 기본값(1MiB)이 앱의 상한보다 작으면 앱 로직 검증 전에 차단된다.
    client_max_body_size 64m;

    location = /health {
        proxy_set_header Host $http_host;
        proxy_pass http://demo-was:4000/health;
    }

    location ^~ /demo-api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://demo-was:4000;
    }

    location ^~ /storix-demo/ {
        limit_except GET {
            deny all;
        }
        access_log /var/log/nginx/storix-presigned-access.log storix_presigned_safe;
        proxy_set_header Host $http_host;
        proxy_pass http://versitygw:7070;
    }

    location ^~ /api/v1/public/ {
        limit_except GET {
            deny all;
        }
        proxy_set_header Host $http_host;
        proxy_pass http://app:3000;
    }

    location / {
        try_files $uri /index.html;
    }
}
