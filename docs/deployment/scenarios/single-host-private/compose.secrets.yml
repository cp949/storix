# 비밀값을 compose secret 파일로 전달하는 override다. compose.private.yml 뒤에 겹쳐 쓴다.
# 설명과 절차는 README.md "비밀값 파일 전달"에 있다.
#
# 이 파일이 하는 일:
#   - app에 STORIX_API_KEY와 STORIX_ENCRYPTION_MASTER_KEY를 /run/secrets 파일로 전달한다.
#   - 두 변수의 환경변수 값을 ""로 비운다. 빈 값은 지정하지 않은 것으로 본다.
#     비우지 않으면 환경변수와 _FILE이 함께 지정되어 기동이 실패한다.
#   - 호스트의 비밀 파일 위치는 STORIX_SCENARIO_SECRETS_DIR(기본 /etc/storix/secrets)이다.
#
# Postgres 조합은 compose.secrets-postgres.yml도 겹쳐 쓴다.

services:
  app:
    environment:
      STORIX_API_KEY: ""
      STORIX_API_KEY_FILE: /run/secrets/storix_api_key
      STORIX_ENCRYPTION_MASTER_KEY: ""
      STORIX_ENCRYPTION_MASTER_KEY_FILE: /run/secrets/storix_encryption_master_key
    secrets: [storix_api_key, storix_encryption_master_key]

secrets:
  storix_api_key:
    file: ${STORIX_SCENARIO_SECRETS_DIR:-/etc/storix/secrets}/storix_api_key
  storix_encryption_master_key:
    file: ${STORIX_SCENARIO_SECRETS_DIR:-/etc/storix/secrets}/storix_encryption_master_key
