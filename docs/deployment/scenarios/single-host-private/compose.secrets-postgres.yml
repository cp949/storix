# docker-compose.postgres.yml과 compose.secrets.yml을 함께 쓸 때만 겹쳐 쓰는 override다.
#
# 이 파일이 하는 일:
#   - Postgres 비밀번호를 compose secret 파일 하나로 postgres와 Storix 서비스에 전달한다.
#   - postgres는 공식 이미지의 POSTGRES_PASSWORD_FILE을 쓴다. POSTGRES_PASSWORD 값은 ""로 비운다.
#   - Storix 서비스의 STORIX_DB_PASSWORD 값을 ""로 비우고 _FILE을 준다.
#     기본값(storix)과 env 파일에 지정한 값 모두 비운다.

x-db-password: &db-password
  environment:
    STORIX_DB_PASSWORD: ""
    STORIX_DB_PASSWORD_FILE: /run/secrets/storix_db_password
  secrets: [storix_db_password]

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/storix_db_password
    secrets: [storix_db_password]
  migrate: *db-password
  app: *db-password
  gc: *db-password
  backup: *db-password
  restore: *db-password

secrets:
  storix_db_password:
    file: ${STORIX_SCENARIO_SECRETS_DIR:-/etc/storix/secrets}/storix_db_password
