# AWS S3 백엔드 override — 관리형 서비스라 컨테이너로 띄울 대상이 없다.
# app/gc/backup/restore의 엔드포인트 관련 값만 S3용으로 고정하고, 리전·
# 자격증명·버킷은 .env의 STORIX_STORAGE_REGION/STORIX_STORAGE_ACCESS_KEY/STORIX_STORAGE_SECRET_KEY/
# STORIX_STORAGE_BUCKET을 그대로 쓴다. base docker-compose.yml과 함께 -f로 겹쳐 쓴다:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d
#
# 사전 준비 (compose가 대신 해주지 않는다):
#   - AWS 콘솔/CLI로 버킷을 미리 만들어 둔다(자동 생성 없음 — 자격증명에
#     버킷 생성 권한까지 요구하지 않기 위해).
#   - IAM 사용자를 만들고 해당 버킷에 한정한 최소 권한 access key를 발급한다.
#     Storix는 모든 업로드를 크기 미지정 스트림으로 보내 minio-js가 항상
#     멀티파트 경로를 타므로 GetObject/PutObject/DeleteObject/ListBucket에
#     더해 ListBucketMultipartUploads/AbortMultipartUpload/
#     ListMultipartUploadParts가 필요하다. 정책 JSON은 README.s3.md 참고.
#   - .env에 실제 발급값을 넣는다(전부 샘플 — 반드시 실제 값으로 교체):
#       STORIX_STORAGE_REGION=SAMPLE-ap-northeast-2
#       STORIX_STORAGE_ACCESS_KEY=AKIASAMPLEXXXXXXXXX
#       STORIX_STORAGE_SECRET_KEY=SAMPLEXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
#       STORIX_STORAGE_BUCKET=SAMPLE-your-bucket-name
#     .env의 STORIX_STORAGE_ENDPOINT/STORIX_STORAGE_PORT/STORIX_STORAGE_USE_SSL/STORIX_STORAGE_PATH_STYLE/
#     STORIX_STORAGE_PUBLIC_*은 이 파일이 덮어쓰므로 이 조합에서는 무시된다.
#
# STORIX_STORAGE_ENDPOINT를 s3.amazonaws.com으로 고정했다 — 리전에 따라 리다이렉트가
# 발생하면 이 파일을 복사해 s3.<region>.amazonaws.com으로 바꾼다.
#
# 자격증명을 STORIX_STORAGE_ACCESS_KEY/STORIX_STORAGE_SECRET_KEY로 그대로 쓰는 것이 안전한
# 이유: 이 조합에는 그 값을 root 자격증명으로 받는 minio/versitygw 컨테이너가
# 없다(각각 별도 override 파일에만 존재). 진짜 AWS 시크릿이 흘러들어갈 다른
# 서비스가 없다.
#
# 한계: MinioBlobStorage는 minio SDK Client를 그대로 쓰므로 정적 access/secret
# key만 지원한다 — IAM 역할, STS 세션 토큰은 미지원.
#
# 값을 비워두면 compose 파싱은 통과하지만, app이 실제로 스토리지에 접근하는
# 시점(부팅 헬스체크 또는 최초 요청)에 인증 실패로 드러난다 — base와 같은
# 이유로 `${VAR:?}` 필수 마커는 쓰지 않는다(profile 필터링보다 먼저 파일
# 전체에 대해 평가돼, 무관한 profile 실행까지 막아버린다).

x-s3-env: &s3-env
  STORIX_STORAGE_ENDPOINT: s3.amazonaws.com
  STORIX_STORAGE_PORT: '443'
  STORIX_STORAGE_USE_SSL: 'true'
  STORIX_STORAGE_PATH_STYLE: 'false'

services:
  app:
    environment:
      <<: *s3-env
      # presigned URL도 같은 엔드포인트를 그대로 쓴다 — S3는 애초에 외부에서
      # 접근 가능한 주소라 내부/외부 구분(STORIX_STORAGE_PUBLIC_*)이 필요 없다.
      STORIX_STORAGE_PUBLIC_ENDPOINT: s3.amazonaws.com
      STORIX_STORAGE_PUBLIC_PORT: '443'
      STORIX_STORAGE_PUBLIC_USE_SSL: 'true'

  gc:
    environment: *s3-env

  backup:
    environment: *s3-env

  restore:
    environment: *s3-env
