services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-storix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storix}
      POSTGRES_DB: ${DB_NAME:-storix}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-storix}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-storix}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-storix-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-storix} ${MINIO_SECRET_KEY:-storix-secret} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-storix}
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@storix/api', 'run', 'migration:run:prod']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
    depends_on:
      postgres:
        condition: service_healthy

  gc:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@storix/api', 'run', 'gc:run:prod']
    profiles: ['gc']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-storix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-storix-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-storix}
      ORPHAN_GRACE_PERIOD: ${ORPHAN_GRACE_PERIOD:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-storix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-storix-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-storix}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-5368709120}
      MAX_SYNC_DELETE_NODES: ${MAX_SYNC_DELETE_NODES:-1000}
      MAX_SYNC_COPY_NODES: ${MAX_SYNC_COPY_NODES:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
