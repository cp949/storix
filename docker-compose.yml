services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-storix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storix}
      POSTGRES_DB: ${DB_NAME:-storix}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-storix}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-storix}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-storix-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-storix} ${MINIO_SECRET_KEY:-storix-secret} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-storix}
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@storix/api', 'run', 'migration:run:prod']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
    depends_on:
      postgres:
        condition: service_healthy

  gc:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@storix/api', 'run', 'gc:run:prod']
    profiles: ['gc']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-storix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-storix-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-storix}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-}
      MINIO_REGION: ${MINIO_REGION:-}
      ORPHAN_GRACE_PERIOD: ${ORPHAN_GRACE_PERIOD:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@storix/api', 'run', 'backup:run:prod']
    profiles: ['backup']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-storix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-storix-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-storix}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-}
      MINIO_REGION: ${MINIO_REGION:-}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  restore:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@storix/api', 'run', 'restore:run:prod']
    profiles: ['restore']
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-storix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-storix-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-storix}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-}
      MINIO_REGION: ${MINIO_REGION:-}
      # `${VAR:?}` 마커는 profile 필터링보다 먼저, 파일 전체에 대해 평가된다 —
      # 여기에 쓰면 restore profile을 쓰지 않는 모든 compose 명령까지 중단시킨다.
      # 미설정(빈 문자열) 검출은 RestoreJob 생성자가 실제 복구 실행 시점에만
      # 담당한다.
      RESTORE_SOURCE_DIR: ${RESTORE_SOURCE_DIR:-}
      RESTORE_FORCE: ${RESTORE_FORCE:-false}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-storix}
      DB_PASSWORD: ${DB_PASSWORD:-storix}
      DB_NAME: ${DB_NAME:-storix}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-storix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-storix-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-storix}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-5368709120}
      MAX_SYNC_DELETE_NODES: ${MAX_SYNC_DELETE_NODES:-1000}
      MAX_SYNC_COPY_NODES: ${MAX_SYNC_COPY_NODES:-1000}
      PRESIGNED_URL_EXPIRY_SECONDS: ${PRESIGNED_URL_EXPIRY_SECONDS:-300}
      API_KEY: '${API_KEY:?API_KEY must be set — generate with: openssl rand -hex 32}'
      API_KEY_PREVIOUS: ${API_KEY_PREVIOUS:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  nginx-cert-init:
    image: alpine:3.21
    profiles: ['nginx-demo']
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -newkey rsa:2048 \
          -keyout /certs/nginx.key -out /certs/nginx.crt \
          -days 3650 \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    volumes:
      - nginx-certs:/certs

  nginx:
    image: nginx:1.27-alpine
    profiles: ['nginx-demo']
    ports:
      - '${NGINX_PUBLIC_PORT:-8443}:443'
    volumes:
      - nginx-certs:/etc/nginx/certs:ro
      - ./docs/deployment/nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nginx-cert-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  nginx-certs:
