# Storix base 파일 — API 서버(app)와 운영 잡(migrate/gc/backup/restore)만
# 정의한다. Postgres와 스토리지(S3 호환) 컨테이너는 포함하지 않는다. 이 파일
# 단독으로 기동하면 .env의 STORIX_DB_*/STORIX_STORAGE_* 접속 정보로 이미 운영 중인 외부
# DB·스토리지에 붙는다.
#
# 컨테이너를 추가하려면 같은 디렉터리의 override 파일을 -f로 겹쳐 쓴다:
#   docker-compose.versitygw.yml  VersityGW 컨테이너 (목표 기본 백엔드, ADR-0003)
#   docker-compose.s3.yml         AWS S3 (컨테이너 없음, 접속값만 고정)
#   docker-compose.postgres.yml   개발·검증용 Postgres 컨테이너
#   docker-compose.sqlite.yml     Postgres 대신 SQLite 파일 DB (컨테이너 없음, ADR-0022)
#
#   # 운영: VersityGW + 외부 Postgres(.env STORIX_DB_HOST)
#   docker compose -f docker-compose.yml -f docker-compose.versitygw.yml up -d
#   # 개발: 위 + 로컬 Postgres
#   docker compose -f docker-compose.yml -f docker-compose.versitygw.yml -f docker-compose.postgres.yml up -d
#
# 매번 -f를 나열하지 않으려면:
#   - 원하는 override를 docker-compose.override.yml로 복사·수정한다(gitignore됨).
#     docker compose/podman-compose 둘 다 `up`만으로 자동 병합한다.
#   - .env에 COMPOSE_FILE=docker-compose.yml:docker-compose.versitygw.yml 을 둔다.
#     docker compose는 .env의 COMPOSE_FILE을 읽지만 podman-compose는 읽지
#     않으므로 podman에서는 쉘에서 export한다.
#
# 문법은 compose-spec 표준만 사용한다 — Docker/Podman 공통(DEPLOY-05).
# 배치 결정 배경: docs/adr/0004-compose-file-layout.md

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

# STORIX_DB_HOST/STORIX_STORAGE_ENDPOINT를 `${VAR:?}` 필수 마커로 강제하지 않는다 — 필수
# 마커는 profile 필터링·override 병합보다 먼저 파일 전체에 대해 평가돼,
# override가 값을 채우는 조합(postgres/versitygw)까지 막아버린다.
# 미설정은 app이 부팅 시점에 거부한다(STORIX_DB_HOST는 requireEnv, STORIX_STORAGE_ENDPOINT는
# ConfigService.getOrThrow).
x-db-env: &db-env
  STORIX_DB_DRIVER: ${STORIX_DB_DRIVER:-postgres}
  STORIX_DB_SQLITE_PATH: ${STORIX_DB_SQLITE_PATH:-}
  STORIX_DB_HOST: ${STORIX_DB_HOST:-}
  STORIX_DB_PORT: ${STORIX_DB_PORT:-5432}
  STORIX_DB_USERNAME: ${STORIX_DB_USERNAME:-storix}
  STORIX_DB_PASSWORD: ${STORIX_DB_PASSWORD:-storix}
  STORIX_DB_NAME: ${STORIX_DB_NAME:-storix}

x-storage-env: &storage-env
  STORIX_STORAGE_ENDPOINT: ${STORIX_STORAGE_ENDPOINT:-}
  STORIX_STORAGE_PORT: ${STORIX_STORAGE_PORT:-9000}
  STORIX_STORAGE_USE_SSL: "${STORIX_STORAGE_USE_SSL:-false}"
  STORIX_STORAGE_ACCESS_KEY: ${STORIX_STORAGE_ACCESS_KEY:-storix}
  STORIX_STORAGE_SECRET_KEY: ${STORIX_STORAGE_SECRET_KEY:-storix-secret}
  STORIX_STORAGE_BUCKET: ${STORIX_STORAGE_BUCKET:-storix}
  STORIX_STORAGE_PATH_STYLE: ${STORIX_STORAGE_PATH_STYLE:-}
  STORIX_STORAGE_REGION: ${STORIX_STORAGE_REGION:-}
  STORIX_STORAGE_SOCKET_TIMEOUT_MS: ${STORIX_STORAGE_SOCKET_TIMEOUT_MS:-}
  STORIX_STORAGE_CONNECT_TIMEOUT_MS: ${STORIX_STORAGE_CONNECT_TIMEOUT_MS:-}
  STORIX_STORAGE_MAX_SOCKETS: ${STORIX_STORAGE_MAX_SOCKETS:-}

services:
  migrate:
    build: *api-build
    command:
      ["pnpm", "--filter", "@cp949/storix-api", "run", "migration:run:prod"]
    environment: *db-env

  gc:
    build: *api-build
    command: ["pnpm", "--filter", "@cp949/storix-api", "run", "gc:run:prod"]
    profiles: ["gc"]
    environment:
      <<: [*db-env, *storage-env]
      STORIX_ORPHAN_GRACE_PERIOD: ${STORIX_ORPHAN_GRACE_PERIOD:-86400}
      STORIX_MUTATION_MAX_UPLOAD_SECONDS: ${STORIX_MUTATION_MAX_UPLOAD_SECONDS:-86400}
      STORIX_GC_MIN_INTERVAL: ${STORIX_GC_MIN_INTERVAL:-3600}
      STORIX_VFS_CHANGE_RETENTION_DAYS: ${STORIX_VFS_CHANGE_RETENTION_DAYS:-30}
      STORIX_NAMESPACE_DELETED_RETENTION_DAYS: ${STORIX_NAMESPACE_DELETED_RETENTION_DAYS:-30}
      STORIX_GC_MAX_ROWS_PER_STAGE: ${STORIX_GC_MAX_ROWS_PER_STAGE:-200000}
      STORIX_SENTRY_DSN: ${STORIX_SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    build: *api-build
    command: ["pnpm", "--filter", "@cp949/storix-api", "run", "backup:run:prod"]
    profiles: ["backup"]
    environment:
      <<: [*db-env, *storage-env]
      STORIX_BACKUP_DIR: ${STORIX_BACKUP_DIR:-/backups}
      STORIX_SENTRY_DSN: ${STORIX_SENTRY_DSN:-}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  restore:
    build: *api-build
    command:
      ["pnpm", "--filter", "@cp949/storix-api", "run", "restore:run:prod"]
    profiles: ["restore"]
    environment:
      <<: [*db-env, *storage-env]
      # `${VAR:?}` 마커를 쓰지 않는 이유는 위 x-db-env 주석과 같다. 미설정(빈
      # 문자열) 검출은 RestoreJob 생성자가 실제 복구 실행 시점에만 담당한다.
      STORIX_RESTORE_SOURCE_DIR: ${STORIX_RESTORE_SOURCE_DIR:-}
      STORIX_RESTORE_FORCE: "${STORIX_RESTORE_FORCE:-false}"
      STORIX_SENTRY_DSN: ${STORIX_SENTRY_DSN:-}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: *api-build
    ports:
      - "${STORIX_PUBLISH_HOST:-0.0.0.0}:${STORIX_PUBLISH_PORT:-3000}:3000"
    environment:
      <<: [*db-env, *storage-env]
      # 컨테이너 안의 listen 포트는 3000 고정이다. 호스트 노출 포트는 위 ports의
      # STORIX_PUBLISH_PORT가 담당한다(ADR-0005 — 한 이름에 두 의미를 두지 않는다).
      # 숫자 리터럴은 quote한다 — podman-compose는 environment의 unquoted 정수를
      # 같은 서비스 안의 `${VAR}` 치환에 int 그대로 넣어 파싱에 실패한다.
      # 아래 override 파일들의 STORIX_STORAGE_PORT/STORIX_DB_PORT도 같은 이유로 quote한다.
      STORIX_PORT: "3000"
      STORIX_STORAGE_PUBLIC_ENDPOINT: ${STORIX_STORAGE_PUBLIC_ENDPOINT:-}
      STORIX_STORAGE_PUBLIC_PORT: ${STORIX_STORAGE_PUBLIC_PORT:-9000}
      STORIX_STORAGE_PUBLIC_USE_SSL: "${STORIX_STORAGE_PUBLIC_USE_SSL:-false}"
      STORIX_DEFAULT_FILE_SIZE_BYTES: ${STORIX_DEFAULT_FILE_SIZE_BYTES:-}
      STORIX_MAX_FILE_SIZE_BYTES: ${STORIX_MAX_FILE_SIZE_BYTES:-}
      STORIX_DEFAULT_MAX_FILES_PER_FOLDER: ${STORIX_DEFAULT_MAX_FILES_PER_FOLDER:-}
      STORIX_MAX_FILES_PER_FOLDER: ${STORIX_MAX_FILES_PER_FOLDER:-}
      STORIX_DEFAULT_MAX_LIVE_NODES: ${STORIX_DEFAULT_MAX_LIVE_NODES:-}
      STORIX_MAX_LIVE_NODES: ${STORIX_MAX_LIVE_NODES:-}
      STORIX_DEFAULT_TOTAL_LOGICAL_BYTES: ${STORIX_DEFAULT_TOTAL_LOGICAL_BYTES:-}
      STORIX_MAX_TOTAL_LOGICAL_BYTES: ${STORIX_MAX_TOTAL_LOGICAL_BYTES:-}
      STORIX_MAX_RETAINED_TRASH_NODES: ${STORIX_MAX_RETAINED_TRASH_NODES:-100000}
      STORIX_MAX_SYNC_DELETE_NODES: ${STORIX_MAX_SYNC_DELETE_NODES:-1000}
      STORIX_MAX_SYNC_COPY_NODES: ${STORIX_MAX_SYNC_COPY_NODES:-1000}
      STORIX_MAX_SYNC_MOVE_NODES: ${STORIX_MAX_SYNC_MOVE_NODES:-10000}
      STORIX_PRESIGNED_URL_EXPIRY_SECONDS: ${STORIX_PRESIGNED_URL_EXPIRY_SECONDS:-300}
      STORIX_MAX_SYNC_SNAPSHOT_NODES: ${STORIX_MAX_SYNC_SNAPSHOT_NODES:-1000}
      STORIX_MAX_SNAPSHOT_BYTES: ${STORIX_MAX_SNAPSHOT_BYTES:-5368709120}
      STORIX_MAX_RETAINED_SNAPSHOT_NODES: ${STORIX_MAX_RETAINED_SNAPSHOT_NODES:-100000}
      STORIX_MAX_RETAINED_SNAPSHOT_BYTES: ${STORIX_MAX_RETAINED_SNAPSHOT_BYTES:-53687091200}
      STORIX_MUTATION_LEASE_SECONDS: ${STORIX_MUTATION_LEASE_SECONDS:-60}
      STORIX_MUTATION_MAX_UPLOAD_SECONDS: ${STORIX_MUTATION_MAX_UPLOAD_SECONDS:-86400}
      STORIX_VFS_EXPIRY_MIN_SECONDS: ${STORIX_VFS_EXPIRY_MIN_SECONDS:-60}
      STORIX_VFS_EXPIRY_MAX_SECONDS: ${STORIX_VFS_EXPIRY_MAX_SECONDS:-2592000}
      STORIX_SHUTDOWN_TIMEOUT_SECONDS: ${STORIX_SHUTDOWN_TIMEOUT_SECONDS:-25}
      # `${VAR:?}` 필수 마커는 override 병합 전에 파일 전체에 평가된다.
      # 이 마커를 쓰면 STORIX_API_KEY_FILE만 주는 배포가 compose 단계에서 막히므로 `:-`를 쓴다.
      # 미설정은 app이 부팅 시점에 거부한다(auth.module). 값은 openssl rand -hex 32로 만든다.
      STORIX_API_KEY: ${STORIX_API_KEY:-}
      STORIX_API_KEY_PREVIOUS: ${STORIX_API_KEY_PREVIOUS:-}
      STORIX_ADMIN_API_KEY: ${STORIX_ADMIN_API_KEY:-}
      STORIX_ADMIN_API_KEY_PREVIOUS: ${STORIX_ADMIN_API_KEY_PREVIOUS:-}
      STORIX_ENCRYPTION_MASTER_KEY: ${STORIX_ENCRYPTION_MASTER_KEY:-}
      STORIX_SENTRY_DSN: ${STORIX_SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # docker stop이 SIGKILL을 보내기 전 대기 시간이다. app이 진행 중 요청을 기다리는 상한
    # (STORIX_SHUTDOWN_TIMEOUT_SECONDS, 기본 25초)보다 길어야 한다. 그 값을 올리면 함께 올린다.
    stop_grace_period: 30s
    # curl은 이미지 축소를 위해 런타임에서 purge했으므로(apps/api/Dockerfile)
    # Node 내장 fetch로 검사한다. /health/ready는 DB·스토리지 연결까지 확인한다 —
    # /health/live(프로세스 생존만)보다 self-host 운영자에게 더 유용한 신호다.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
